<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Galmuri9;src:url(Galmuri9.woff2) format('woff2')}
body{margin:0;background:#20242a;font-family:Galmuri9,sans-serif;color:#dde}
.row{display:flex;flex-wrap:wrap;gap:24px;padding:20px}
.cell{display:flex;flex-direction:column;gap:8px;font-size:18px}
canvas{image-rendering:pixelated;width:480px;height:432px;border-radius:6px}
</style>
<div class="row">
  <div class="cell"><span>타이틀</span><canvas id="t" width="160" height="144"></canvas></div>
  <div class="cell"><span>필드 — 파일섬 해변</span><canvas id="a" width="160" height="144"></canvas></div>
  <div class="cell"><span>전투</span><canvas id="c" width="160" height="144"></canvas></div>
  <div class="cell"><span>진화</span><canvas id="e" width="160" height="144"></canvas></div>
</div>
<script src="pix.js"></script>
<script src="mons.js"></script>
<script src="field.js"></script>
<script>
(async function(){
  await document.fonts.load('10px Galmuri9');
  const {toCanvas,K,W,silhouette}=DigiPix, {MON}=DigiMons, {WALK,TILE}=DigiField;
  const PAPER='#f8f8f8';
  // 글자를 또렷한 점으로 (반투명 가장자리 제거). big = 2배로 키움
  function glyphs(str,col){
    const c=document.createElement('canvas');c.width=160;c.height=14;const t=c.getContext('2d');
    t.font='10px Galmuri9';t.textBaseline='top';t.fillStyle=col;t.fillText(str,0,1);
    const d=t.getImageData(0,0,160,14);for(let i=3;i<d.data.length;i+=4)d.data[i]=d.data[i]>110?255:0;t.putImageData(d,0,0);
    return c;
  }
  function text(g,str,x,y,col){ g.drawImage(glyphs(str,col||K),x,y); }
  function bigText(g,str,x,y,col,edge){
    const a=glyphs(str,edge||K), b=glyphs(str,col); g.imageSmoothingEnabled=false;
    for(const [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2],[-2,-2],[2,2],[-2,2],[2,-2],[0,4],[2,4],[-2,4]]) g.drawImage(a,x+dx,y+dy,320,28);
    g.drawImage(b,x,y,320,28);
  }
  // 금판 대사창: 검은 테두리 + 안쪽 한 줄
  function box(g,x,y,w,h){g.fillStyle=K;g.fillRect(x,y,w,h);g.fillStyle=PAPER;g.fillRect(x+1,y+1,w-2,h-2);g.fillStyle=K;g.fillRect(x+3,y+3,w-6,1);g.fillRect(x+3,y+h-4,w-6,1);g.fillRect(x+3,y+3,1,h-6);g.fillRect(x+w-4,y+3,1,h-6);}
  const put=(g,s,x,y)=>g.drawImage(toCanvas(s,1),x,y);
  const arrowR=(g,x,y)=>{g.fillStyle=K;g.fillRect(x,y,1,7);g.fillRect(x+1,y+1,1,5);g.fillRect(x+2,y+2,1,3);g.fillRect(x+3,y+3,1,1);};
  const arrowD=(g,x,y)=>{g.fillStyle=K;g.fillRect(x,y,5,1);g.fillRect(x+1,y+1,3,1);g.fillRect(x+2,y+2,1,1);};
  // HP 막대 (금판: 초록 → 노랑 → 빨강)
  function hpBar(g,x,y,w,ratio){
    g.fillStyle=K;g.fillRect(x,y,w,4);g.fillStyle=PAPER;g.fillRect(x+1,y+1,w-2,2);
    g.fillStyle=ratio>.5?'#48c048':ratio>.2?'#f8c830':'#e83828';g.fillRect(x+1,y+1,Math.round((w-2)*ratio),2);
  }

  // ── 타이틀 ──
  const t=document.getElementById('t').getContext('2d');
  t.fillStyle='#102048';t.fillRect(0,0,160,144);
  t.fillStyle='#1c3870';for(let x=0;x<160;x+=8)t.fillRect(x,0,1,92);for(let y=4;y<92;y+=8)t.fillRect(0,y,160,1); // 디지털 격자
  t.fillStyle='#48d8a8';for(const [x,y] of [[12,10],[30,26],[140,14],[118,40],[20,60],[146,70],[64,8],[96,30]]){t.fillRect(x,y,2,2);}
  bigText(t,'디지몬',22,8,'#f8f8f8');
  // 「금」 배지
  t.fillStyle=K;t.fillRect(104,8,34,30);t.fillStyle='#f8c830';t.fillRect(106,10,30,26);t.fillStyle='#c88818';t.fillRect(106,32,30,4);
  bigText(t,'금',111,10,'#fff8d0','#a06810');
  text(t,'디지털 몬스터 금빛 모험',24,40,'#f8d870');
  t.fillStyle='#58a048';t.fillRect(0,92,160,52);t.fillStyle='#407838';t.fillRect(0,92,160,2);
  t.fillStyle='#80c060';for(let x=4;x<160;x+=12)t.fillRect(x,100+(x%3)*6,3,1);
  put(t,MON.agumon(),60,62);
  text(t,'START 를 누르세요',32,112,'#f8f8f8');
  text(t,'비공식 팬 게임',46,128,'#c8e8b0');

  // ── 필드 ──
  const a=document.getElementById('a').getContext('2d');
  const map=['JJJJpJJJJJ','JTTTpTTTJJ','ggggpggggg','ssssssssss','ssssssssss','ssssssssss','~~~~~~~~~~','==========','=========='];
  const key={J:'jungle',T:'tall',g:'grass',p:'path',s:'sand','~':'shore','=':'sea'};
  map.forEach((r,y)=>[...r].forEach((ch,x)=>put(a,TILE[key[ch]],x*16,y*16)));
  for(const x of [5,6,7,8]) put(a,TILE.booth,x*16,40);
  put(a,TILE.palm,0,40); put(a,TILE.palm,144,56);
  put(a,WALK.agumon,32,64); put(a,WALK.taichi,48,64);
  box(a,0,96,160,48); text(a,'아구몬: 태일아! 바닷가에',9,105); text(a,'전화박스가 잔뜩 있어!',9,121);
  arrowD(a,148,136);

  // ── 전투 ──
  const c=document.getElementById('c').getContext('2d');
  c.fillStyle=PAPER;c.fillRect(0,0,160,144);
  put(c,MON.kuwagamon(),100,0);
  put(c,MON.agumonBack(),8,48);
  // 상대 정보
  text(c,'쿠와가몬',6,1); text(c,'Lv12',62,13);
  text(c,'HP',8,21,'#e09820'); hpBar(c,22,24,56,.8);
  c.fillStyle=K;c.fillRect(4,31,80,1);c.fillRect(4,22,1,10);c.fillRect(84,29,1,3);
  // 내 정보 (상대 그림 아래 줄부터)
  text(c,'아구몬',84,56); text(c,'Lv5',134,56);
  text(c,'HP',86,67,'#e09820'); hpBar(c,100,70,54,1);
  text(c,'20/ 20',114,77);
  c.fillStyle='#3060d0';c.fillRect(100,90,30,2);c.fillStyle=K;c.fillRect(100,89,54,1);c.fillRect(100,92,54,1);
  c.fillStyle=K;c.fillRect(156,66,1,28);c.fillRect(80,94,77,1);
  // 대사창 + 메뉴
  box(c,0,96,72,48); text(c,'아구몬은',7,105); text(c,'무엇을 할까?',7,121);
  box(c,70,96,90,48); text(c,'싸운다',82,105); text(c,'디지몬',120,105); text(c,'가방',82,121); text(c,'도망',120,121);
  arrowR(c,76,107);

  // ── 진화 ──
  const e=document.getElementById('e').getContext('2d');
  e.fillStyle=PAPER;e.fillRect(0,0,160,144);
  // 디지털 빛줄기
  e.fillStyle='#d8ecf8';for(let i=0;i<12;i++){const ang=i*Math.PI/6;for(let r=34;r<90;r+=1){const x=80+Math.cos(ang)*r,y=46+Math.sin(ang)*r;e.fillRect(Math.round(x),Math.round(y),2,2);}}
  put(e,silhouette(MON.agumon(),'#c8d8e8'),18,52);
  put(e,MON.greymon(),52,18);
  e.fillStyle='#f8c830';for(const [x,y] of [[40,20],[120,30],[34,70],[126,74],[86,10]]){e.fillRect(x,y-2,1,5);e.fillRect(x-2,y,5,1);}
  box(e,0,96,160,48); text(e,'아구몬 진화ㅡ!',9,105); text(e,'그레이몬!',9,121);
  arrowD(e,148,136);
})();
</script>
