:root {

}

  }
}
:root[data-theme="dark"] {

  --vac: #7fb4ee; --vac-bg: #17304d; --dat: #6fcf91; --dat-bg: #153a24; --vir: #cf9be6; --vir-bg: #3a1f48; --neu: #92a6a5; --neu-bg: #223031;

  --chip-bg-l: 24%; --chip-fg-l: 86%; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;

.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
.top { padding: 20px 0 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }

.legend b { color: var(--fg); font-weight: 600; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.row1 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; font: inherit; font-weight: 500; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.tabs button + button { border-left: 1px solid var(--line); }
input[type="search"], select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; }
input[type="search"] { flex: 1 1 220px; }
.btn { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lab { color: var(--muted); font-size: 12px; margin-right: 2px; }
.fchip { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.count { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.pill.vac { color: var(--vac); background: var(--vac-bg); } .pill.dat { color: var(--dat); background: var(--dat-bg); }
.pill.vir { color: var(--vir); background: var(--vir-bg); } .pill.neu { color: var(--neu); background: var(--neu-bg); font-weight: 500; }
.tchip { display: inline-block; font-size: 12px; border-radius: 4px; padding: 1px 6px; white-space: nowrap;

.stg { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }

.node { position: relative; }

.dcol { display: grid; gap: 12px; align-content: start; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface2); position: sticky; top: 0; }

  treeBox.appendChild(Object.assign(document.createElement('div'), { className: 'empty', hidden: true, id: 'empty-tree', textContent: '조건에 맞는 종이 없습니다. 필터 지우기를 눌러 보세요.' }));
  memoBox.innerHTML = "<div class=\"memo\">\n<h2>자료 점검 메모</h2>\n<p class=\"dup\">최신 롬(이지+노래) 기준으로 롬에서 직접 읽어 점검한 결과입니다. 점검에서 나온 문제는 사용자와 정해서 롬에서 고쳤고, 아래에는 고친 내용과 남은 참고 사항만 적었습니다.</p>\n<h2 style=\"margin-top:14px\"><span class=\"ok\">문제 없음</span></h2>\n<ul>\n<li>188종 모두 얻는 길이 있습니다(야생·이벤트·진화). 얻을 길이 없는 종은 0입니다.</li>\n<li>모든 종에 필살기가 1개 이상 있고, Lv1 기술이 있으며, Lv2 이후 기술이 4개 이상입니다. 같은 이름 기술을 두 번 배우는 종은 0입니다.</li>\n<li>진화 294건 전부: 단계를 건너뛰는 진화 0(레오몬 → 사벨레오몬만 원작 그대로 예외), 거꾸로 가는 진화 0, 단계가 오르는 진화는 능력치 합이 20 이상 오름. 롬 검사 도구(<code>rom_check.py</code>)가 자동으로 봅니다.</li>\n<li>같은 이름의 종이 없습니다(다크그레몬·황제파이터로 구분).</li>\n<li>롬의 속성표와 도감 분류 글의 속성이 188종 모두 같습니다.</li>\n<li>진화에 쓰는 도구(태그, 궁극의 문장, 디지멘탈류, 어둠의돌, 검은 톱니, 금속코트, 오메가블레이드)는 모두 설계상 얻는 길이 있습니다(수호자 보상·상점·이벤트).</li>\n</ul>\n<h2 style=\"margin-top:14px\"><span class=\"ok\">이번에 고친 것</span> (v1.1)</h2>\n<ul>\n<li><b>건너뛰기 진화</b>: 시드라몬 → 메가시드라몬 → 메탈시드라몬, 피코데블몬 → 데블몬 → 묘티스몬, 가지몬 → 데블드라몬(원작 성숙기로 내림) → 메가드라몬. 번개콩알몬이 콩알몬으로 되돌아가던 진화는 삭제.</li>\n<li><b>능력치</b>: 진화 전후가 같거나 가깝던 것을 벌림(스카몬 470, 묘티스몬 560, 네페르티몬 540, 매그너몬 590, 번개콩알몬 580). 스타팅 균형: 파닥몬 410, 엔젤몬 490.</li>\n<li><b>암흑·고스트 필살기</b>: 암흑·고스트 타입 46종 중 필살기가 없던 19종에 해당 타입 필살기를 넣음(블랙워가루몬 원월차기, 마린데블몬 길티블랙, 그란쿠와몬 존블랙홀 등). 필살기 칸이 모자라 성숙기 위주로 둘째 필살기 11개는 뺌. 가지몬(성장기라 필살기 1개뿐)만 예외.</li>\n<li><b>필살기 연출</b>: 설계 자료가 정해 둔 연출(메가플레임→화염방사 등)을 쓰게 하고, 새 필살기에도 어울리는 기존 연출을 지정(예: 다크리사이틀→하이퍼보이스, 존블랙홀→섀도볼). 새 연출을 만든 건 아님.</li>\n<li><b>야생 레벨</b>: 야생에 Lv30 넘는 성장기(파닥몬·피코데블몬·추추몬 Lv32~55)가 나오던 것을 레벨에 맞는 성숙기·완전체로 바꿈. 파닥몬(스타팅 셋 중 안 고른 하나)은 성도 초반 Lv6 드문 칸, 추추몬은 31번도로 Lv4 로 옮김. 초반 수호자 트레이너는 예외로 둠.</li>\n<li><b>능력치(물·고스트)</b>: 돌핀몬·고래몬·왕개굴몬·서브마리몬·고스몬은 센 쪽 능력치와 주력 기술 분류가 반대였음(4세대는 분류가 타입 따라 정해져 물=특수·고스트=물리) → 공격↔특공을 맞바꿈.</li>\n<li><b>타입</b>: 엔젤몬·홀리엔젤몬은 빛/바람(바이러스에 강하게). 엔젤 계열에 바람 공격기(에어슬래시) 추가. 필살기 천사의손·천국의문·천국의화살도 빛. 「영혼」은 원래 이름 「에스퍼」로 되돌림.</li>\n</ul>\n<h2 style=\"margin-top:14px\"><span class=\"warn\">참고 사항</span></h2>\n<ul>\n<li><b>필살기 타입이 종 타입과 다른 종 1종</b>(자속 보정이 없음): 묘티스몬 「악몽의발톱」(암흑, 종 타입은 고스트/에스퍼). 암흑 계열 필살기라 그대로 둠.</li>\n<li><b>원작과 단계 표기가 다른 3종</b>: 고래몬(원작 성숙기, 롬 완전체), 펌프몬(원작 완전체, 롬 성숙기), 돌핀몬(원작 성숙기 분류, 롬 완전체). 진화 사슬은 정상이고, 바꾸면 야생·보스 레벨이 흔들려 그대로 둠.</li>\n<li><b>속성(백신·바이러스)은 원작 분류</b>를 따라서, 바이러스인데 고스트·암흑 타입이 없는 종이 있습니다(워매몬, 스카몬 등). 타입을 억지로 맞추지 않기로 했습니다.</li>\n<li><b>진화 전 성숙기가 Lv38~52 야생에 나오는 곳 10군데</b>(베지몬·프리지몬·가루몬·디그몬·다크티라몬·스팅몬·가드로몬·탱크몬·레어몬·도쿠구몬, 모두 아침 칸): 그 종이 나오는 표가 그곳 하나뿐이라 남겨 둔 것. 고치려면 낮은 레벨 표로 옮겨야 함.</li>\n<li><b>유년기</b>는 토코몬(→ 파닥몬) 1종뿐입니다. 코로몬 같은 유년기는 이 판에 없어서 아구몬 계통은 아구몬부터 시작합니다.</li>\n<li>궁극체가 아닌데 진화가 끝나는 종이 28종 있습니다(블랙워가루몬, 메탈티라몬, 다크퍼펫몬 등 변종·특수형). 설계대로로 보입니다.</li>\n<li>새로 만든 진화(피코데블몬 Lv25, 시드라몬·데블드라몬 태그 진화)는 에뮬레이터로 직접 진화시켜 보지 못했습니다(불확실함). 새 필살기 연출은 일부(존블랙홀·피노키해머·천사의손·길티블랙·다크리사이틀·헬스퀴즈·테러일루전)만 전투 화면으로 확인했습니다.</li>\n</ul>\n<h2 style=\"margin-top:14px\">읽는 법</h2>\n<ul>\n<li>진화 계통 보기: 한 종은 한 번만 자세히 나오고, 다른 종에서도 이어지면 「↗ 위쪽 계통에서 이어서 봄」으로 표시됩니다. 눌러서 그 종으로 이동합니다.</li>\n<li>진화 조건의 「지니고 레벨업」은 해당 도구를 지닌 채 레벨업(낮·밤 모두)입니다. Lv55는 도구 없이 레벨만으로 되는 진화입니다.</li>\n<li>능력치·기술·타입·속성은 모두 롬 값입니다. 출현 장소는 야생 표에서, 이벤트와 트레이너는 설계 표에서 가져왔습니다.</li>\n</ul>\n</div>\n";
  main.appendChild(treeBox); main.appendChild(listBox); main.appendChild(memoBox);

  function setView(v) {
    st.view = v; treeBox.hidden = v !== 'tree'; listBox.hidden = v !== 'list'; memoBox.hidden = v !== 'memo';
    ['tree', 'list', 'memo'].forEach(function (k) { $('tab-' + k).setAttribute('aria-selected', k === v ? 'true' : 'false'); });
    document.querySelectorAll('#bar .chips, #f-type, #btn-reset, #btn-collapse, #btn-expand, #jump, #q, #count').forEach(function (el) { el.hidden = v === 'memo'; });
    $('btn-collapse').hidden = $('btn-expand').hidden = v !== 'tree'; $('jump').hidden = v !== 'tree'; apply();
  }
  $('tab-tree').onclick = function () { setView('tree'); }; $('tab-list').onclick = function () { setView('list'); }; $('tab-memo').onclick = function () { setView('memo'); };
  $('btn-collapse').onclick = function () { nodeEls.forEach(function (b) { if (b._kids) { var root = !b.parentElement.classList.contains('kids'); b._kids.hidden = true; var f = b._row.querySelector('.fold'); if (f) f.textContent = '▸'; if (b._det && !b._det.hidden) b._toggle(); } }); };
  $('btn-expand').onclick = function () { nodeEls.forEach(function (b) { if (b._kids) { b._kids.hidden = false; var f = b._row.querySelector('.fold'); if (f) f.textContent = '▾'; } }); };

  // ---- 적용
  function apply() {
    if (st.view === 'tree') {
      var M = new Map(); SP.forEach(function (r) { var m = matchInfo(r); if (m) M.set(r.i, m); });
      var shown = 0;
      function vis(box) {
        var n = box._n, self = M.has(n.id), any = false;
        if (n.ref) { box.hidden = !self; return self; }
        var kidsEl = box._kids ? Array.prototype.slice.call(box._kids.children) : [];
        kidsEl.forEach(function (k) { if (vis(k)) any = true; });
        var show = self || any; box.hidden = !show;
        box._row.classList.toggle('ctx', !self && any);
        var sp = box._row.querySelector('[data-sp]'); var info = M.get(n.id); sp.innerHTML = spText(BY.get(n.id), info && info.mv);
        if (self) shown++; return show;
      }
      treeBox.querySelectorAll('.sec').forEach(function (sec) { var any = false; Array.prototype.forEach.call(sec.children, function (c) { if (c.classList && c.classList.contains('node')) { if (vis(c)) any = true; } }); sec.hidden = !any; });
      $('empty-tree').hidden = shown > 0; $('count').textContent = shown + '종 표시 / 전체 ' + SP.length + '종';
      if (st.q && shown) { var open = !!st.q; if (open) { nodeEls.forEach(function (b) { if (b._kids) { b._kids.hidden = false; var f = b._row.querySelector('.fold'); if (f) f.textContent = '▾'; } }); } }
    } else if (st.view === 'list') { renderList(); }
  }

  // ---- 전체 목록
  var COLS = [['i', '번호', 1], ['n', '이름', 0], ['s', '단계', 0], ['a', '속성', 0], ['t', '타입', 0], ['h0', 'HP', 1], ['h1', '공', 1], ['h2', '방', 1], ['h3', '특공', 1], ['h4', '특방', 1], ['h5', '속', 1], ['b', '합', 1], ['e', '진화', 1], ['m', '기술', 1]];
  function sortVal(r, k) { if (k[0] === 'h' && k.length === 2) return r.h[+k[1]]; if (k === 's') return si(r.s); if (k === 't') return r.t.join('/'); if (k === 'e') return r.e.length; if (k === 'm') return r.m.length; return r[k]; }
  var openRows = new Set();
  function renderList() {
    var rows = SP.map(function (r) { return [r, matchInfo(r)]; }).filter(function (x) { return x[1]; });
    rows.sort(function (a, b) { var x = sortVal(a[0], st.sort), y = sortVal(b[0], st.sort); return (x < y ? -1 : x > y ? 1 : a[0].i - b[0].i) * st.dir; });
    $('count').textContent = rows.length + '종 표시 / 전체 ' + SP.length + '종';
    var h = '<div class="tw"><table class="sortable"><thead><tr>' + COLS.map(function (c) { return '<th data-k="' + c[0] + '"' + (c[2] ? ' class="r"' : '') + (st.sort === c[0] ? ' aria-sort="' + (st.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '>' + c[1] + (st.sort === c[0] ? (st.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (x) {
      var r = x[0];
      h += '<tr class="lrow" data-r="' + r.i + '"><td class="r num">' + r.i + '</td><td><b>' + esc(r.n) + '</b> ' + dupTag(r) + '</td><td>' + esc(r.s) + '</td><td>' + apill(r) + '</td><td>' + r.t.map(tchip).join(' ') + '</td>' +
        r.h.map(function (v) { return '<td class="r num">' + v + '</td>'; }).join('') + '<td class="r num"><b>' + r.b + '</b></td><td class="r num">' + r.e.length + '</td><td class="r num">' + r.m.length + '</td></tr>';
      if (openRows.has(r.i)) h += '<tr><td colspan="' + COLS.length + '" style="white-space:normal;padding:0"><div class="detail" style="margin:6px 0">' + detailHTML(r) + '</div></td></tr>';
    });
    listBox.innerHTML = h + '</tbody></table></div>' + (rows.length ? '' : '<div class="empty">조건에 맞는 종이 없습니다.</div>');
  }
  listBox.addEventListener('click', function (e) {
    var th = e.target.closest('th[data-k]'); if (th) { var k = th.dataset.k; if (st.sort === k) st.dir = -st.dir; else { st.sort = k; st.dir = (k === 'n' || k === 's' || k === 'a' || k === 't' || k === 'i') ? 1 : -1; } renderList(); return; }
    var tr = e.target.closest('tr.lrow'); if (tr) { var id = +tr.dataset.r; if (openRows.has(id)) openRows.delete(id); else openRows.add(id); renderList(); }
  });

  // ---- 이동
  function goTo(id) {
    if (st.view !== 'tree') setView('tree');
    var box = nodeEls.get(id); if (!box) return;
    if (box.hidden || box.closest('[hidden]')) { $('btn-reset').click(); }
    var p = box.parentElement; while (p && p !== treeBox) { if (p.classList.contains('kids')) p.hidden = false; p = p.parentElement; }
    box.closest('.sec').hidden = false;
    if (box._det.hidden) box._toggle();
    var bar = $('bar').getBoundingClientRect().height + 8; var y = box.getBoundingClientRect().top + window.scrollY - bar;
    window.scrollTo({ top: y, behavior: 'smooth' });
    box._row.classList.remove('flash'); void box._row.offsetWidth; box._row.classList.add('flash');
  }
  setView('tree');
})();
</script>
