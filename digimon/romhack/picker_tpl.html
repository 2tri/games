<title>디지몬 그림 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 교정지(proof sheet) 한 장 = 디지몬 한 칸. 위에 고정 도구줄, 아래로 칸이 단계별로 이어지고, 칸마다 후보 그림 타일을 눌러 고른다. */
:root {
  --bg: #eceee9;            /* 회녹색 종이 */
  --surface: #f8f9f6;       /* 칸 바탕 */
  --ink: #1c2420;
  --muted: #5d6a63;
  --line: #cfd5cc;
  --pick: #1d5fd0;          /* 고른 것 */
  --pick-soft: #dce8fb;
  --bad: #c4372b;           /* 모두 틀림 */
  --bad-soft: #f8e1de;
  --ok: #2e7d4f;
  --warn: #8a5a00;
  --warn-soft: #f6ecd2;
  --sprite: #ffffff;        /* 스프라이트 바탕은 게임 화면처럼 늘 밝게 */
  --f-display: "Do Hyeon", "Noto Sans KR", sans-serif;
  --f-body: "Noto Sans KR", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815; --surface: #1c231f; --ink: #e5ebe6; --muted: #98a59c; --line: #323c36;
    --pick: #7aadff; --pick-soft: #1b2e4d; --bad: #ff8173; --bad-soft: #3d1f1b; --ok: #6fcf97;
    --warn: #e8c46a; --warn-soft: #3a3016; --sprite: #f1f3ee; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815; --surface: #1c231f; --ink: #e5ebe6; --muted: #98a59c; --line: #323c36;
  --pick: #7aadff; --pick-soft: #1b2e4d; --bad: #ff8173; --bad-soft: #3d1f1b; --ok: #6fcf97;
  --warn: #e8c46a; --warn-soft: #3a3016; --sprite: #f1f3ee; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 1180px; margin-inline: auto; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; margin: 20px 0 4px; letter-spacing: .01em; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 14px; max-width: 62ch; }
.lead b { color: var(--ink); font-weight: 700; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-block: 1px solid var(--line); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.prog { flex: 1 1 200px; min-width: 0; }
.prog .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.prog .meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
.prog .meter i { display: block; height: 100%; width: 0; background: var(--pick); transition: width .25s; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; padding: 6px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--pick-soft); color: var(--pick); font-weight: 700; }
select, input[type=search], .btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
input[type=search] { width: 9.5rem; }
.btn { cursor: pointer; }
.btn:hover, .seg button:hover { border-color: var(--pick); }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.save { font-size: 12px; color: var(--muted); }
.save.err { color: var(--bad); }

.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
#list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.gh { font-family: var(--f-display); font-size: 1.15rem; margin: 16px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
.gh small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.row.done { border-color: var(--pick); }
.rh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 10px; }
.rh .nm { font-family: var(--f-display); font-size: 1.3rem; }
.rh .id { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rh a { font-size: 12px; color: var(--pick); }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.chip.st { margin-left: auto; background: var(--pick-soft); color: var(--pick); font-weight: 700; }
.chip.st.bad { background: var(--bad-soft); color: var(--bad); }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { font: inherit; text-align: left; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.tile:hover { border-color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--pick); background: var(--pick-soft); }
.tile[aria-pressed="true"]::after { content: "✓ 채택"; position: absolute; top: 6px; right: 8px; font-size: 11.5px; font-weight: 700; color: var(--pick); }
.tile .lb { font-size: 12px; color: var(--muted); padding-right: 3.2em; }
.tile[aria-pressed="true"] .lb { color: var(--pick); }
.pics { display: flex; align-items: flex-end; gap: 8px; }
.pics .box { background: var(--sprite); border-radius: 4px; padding: 4px; display: flex; align-items: flex-end; justify-content: center; }
.pics img { image-rendering: pixelated; display: block; max-width: none; }
.pics .box.pf { min-width: 120px; min-height: 120px; }
.pics .box.pb { min-width: 104px; min-height: 104px; }
.pics .gone { width: 104px; height: 104px; display: grid; place-items: center; font-size: 11px; color: #777; text-align: center; }
.v-f .pb, .v-b .pf { display: none; }
.tile.none { border-style: dashed; justify-content: center; min-width: 150px; max-width: 190px; }
.tile.none .lb { color: var(--bad); font-size: 13px; font-weight: 500; padding-right: 0; }
.tile.none[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-soft); }
.tile.none[aria-pressed="true"]::after { color: var(--bad); content: "✓"; }
.tile.none small { color: var(--muted); font-size: 11.5px; }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
@media (max-width: 520px) {
  .tiles { gap: 8px; }
  .pics .box.pf { min-width: 104px; min-height: 104px; }
  .pics .box.pb { min-width: 92px; min-height: 92px; }
}
@media (prefers-reduced-motion: reduce) { .prog .meter i { transition: none; } }
</style>

<div class="wrap">
  <h1>디지몬 그림 고르기</h1>
  <p class="lead">칸마다 후보 그림이 있습니다. <b>그 디지몬이 맞는 그림을 한 번 누르면</b> 바로 저장됩니다. 맞는 그림이 없으면 오른쪽 점선 칸을 누르세요. 현재 그림이 맞으면 「현재 롬 그림」을 누르면 됩니다. 이름 옆 「위키몬」 링크로 실제 모습을 볼 수 있습니다.</p>

  <div class="bar" id="bar">
    <div class="prog"><span class="num" id="pnum">0 / 0</span> <span class="save" id="save"></span><div class="meter"><i id="pbar"></i></div></div>
    <div class="seg" id="segView" role="group" aria-label="보이는 면">
      <button type="button" data-v="f" aria-pressed="true">앞</button><button type="button" data-v="b" aria-pressed="false">뒤</button><button type="button" data-v="fb" aria-pressed="false">앞+뒤</button>
    </div>
    <button type="button" class="btn" id="copy">결과 복사</button>
  </div>

  <div class="filters">
    <div class="seg" id="segShow" role="group" aria-label="보이는 칸">
      <button type="button" data-s="all" aria-pressed="true">전체</button><button type="button" data-s="todo" aria-pressed="false">안 고른 것</button><button type="button" data-s="flag" aria-pressed="false">의심</button><button type="button" data-s="alt" aria-pressed="false">바꾼 것</button>
    </div>
    <select id="selGrade" aria-label="단계"></select>
    <input id="q" type="search" placeholder="이름 찾기" aria-label="이름 찾기">
  </div>

  <div id="list"></div>
</div>

<script>
const DATA = /*DATA*/[];
const LABEL = { cur: '현재 롬 그림', bak: '이전 그림', ds: 'DS 원본', none: '모두 틀림' };
const ui = { v: 'f', show: 'all', grade: 'all', q: '' };
const picks = {};            // id → 'cur' | 'bak' | 'ds' | 'none'
const els = {};              // id → { row, tiles: {k: el}, st }
let dbNS = null, saveMsg = null;
const $ = (s) => document.querySelector(s);

function store(get) { try { return get(); } catch (e) { return null; } }
function loadLocal() { const s = store(() => localStorage.getItem('picks.v1')); try { Object.assign(picks, JSON.parse(s || '{}')); } catch (e) {} }
function saveLocal() { store(() => localStorage.setItem('picks.v1', JSON.stringify(picks))); }

function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pic(arr, cls) {
  const box = mk('div', 'box ' + cls);
  if (!arr || !arr[0]) { box.appendChild(mk('div', 'gone', '없음')); return box; }
  const im = new Image(); im.src = arr[0]; im.width = arr[1] * 2; im.height = arr[2] * 2; im.alt = '';
  box.appendChild(im); return box;
}

function build() {
  const list = $('#list'); list.textContent = '';
  let lastGrade = null, head = null;
  for (const r of DATA) {
    if (r.grade !== lastGrade) { lastGrade = r.grade; head = mk('div', 'gh', r.grade); head.dataset.grade = r.grade; head._small = mk('small'); head.appendChild(head._small); list.appendChild(head); }
    const row = mk('section', 'row'); row.dataset.id = r.id; row.dataset.grade = r.grade;
    const rh = mk('div', 'rh');
    rh.appendChild(mk('span', 'nm', r.ko));
    rh.appendChild(mk('span', 'id', r.id));
    if (r.wiki) { const a = mk('a', '', '위키몬'); a.href = 'https://wikimon.net/' + encodeURIComponent(r.wiki); a.target = '_blank'; a.rel = 'noopener'; rh.appendChild(a); }
    if (r.flag) rh.appendChild(mk('span', 'chip', r.flag));
    const st = mk('span', 'chip st'); st.hidden = true; rh.appendChild(st);
    row.appendChild(rh);
    const tiles = mk('div', 'tiles'); const t = {};
    for (const tl of r.tiles) {
      const b = mk('button', 'tile'); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.appendChild(mk('span', 'lb', tl.label));
      const p = mk('div', 'pics'); p.appendChild(pic(tl.f, 'pf')); p.appendChild(pic(tl.b, 'pb')); b.appendChild(p);
      b.addEventListener('click', () => choose(r.id, tl.k)); tiles.appendChild(b); t[tl.k] = b;
    }
    const nb = mk('button', 'tile none'); nb.type = 'button'; nb.setAttribute('aria-pressed', 'false');
    nb.appendChild(mk('span', 'lb', '모두 틀림')); nb.appendChild(mk('small', '', '이 디지몬이 아니다 / 새 그림 필요'));
    nb.addEventListener('click', () => choose(r.id, 'none')); tiles.appendChild(nb); t.none = nb;
    row.appendChild(tiles); list.appendChild(row);
    els[r.id] = { row, tiles: t, st, r };
  }
  const e = mk('div', 'empty', '조건에 맞는 칸이 없습니다.'); e.id = 'empty'; e.hidden = true; list.appendChild(e);
}

function paint(id) {
  const o = els[id]; if (!o) return; const k = picks[id] || null;
  for (const [kk, b] of Object.entries(o.tiles)) b.setAttribute('aria-pressed', String(kk === k));
  o.row.classList.toggle('done', !!k);
  o.st.hidden = !k;
  if (k) { o.st.textContent = k === 'cur' ? '현재 그림이 맞음' : k === 'none' ? '모두 틀림' : LABEL[k] + '으로'; o.st.classList.toggle('bad', k === 'none'); }
}

function visible(o) {
  const r = o.r, k = picks[r.id];
  if (ui.grade !== 'all' && r.grade !== ui.grade) return false;
  if (ui.q && !(r.ko.includes(ui.q) || r.id.includes(ui.q.toLowerCase()))) return false;
  if (ui.show === 'todo') return !k;
  if (ui.show === 'flag') return !!r.flag || k === 'none';
  if (ui.show === 'alt') return !!k && k !== 'cur';
  return true;
}
function refresh() {
  let shown = 0; const perGrade = {};
  for (const o of Object.values(els)) {
    const v = visible(o); o.row.hidden = !v; if (v) { shown++; perGrade[o.r.grade] = (perGrade[o.r.grade] || 0) + 1; }
  }
  for (const h of document.querySelectorAll('.gh')) { const c = perGrade[h.dataset.grade] || 0; h.hidden = !c; h._small.textContent = c + '칸'; }
  $('#empty').hidden = shown > 0;
  const done = DATA.filter((r) => picks[r.id]).length;
  $('#pnum').textContent = done + ' / ' + DATA.length + ' 확인';
  $('#pbar').style.width = (DATA.length ? done / DATA.length * 100 : 0) + '%';
  $('#list').className = 'v-' + ui.v;
}

const chain = {};
function persist(id, k) {
  const p = (chain[id] || Promise.resolve()).then(async () => {
    if (!dbNS) { saveLocal(); return setSave('이 브라우저에만 저장됨', false); }
    const ref = dbNS.doc('picks/' + id), r = els[id].r;
    if (k) await ref.set({ pick: k, name: r.ko, id: r.id, grade: r.grade, at: Date.now() }); else await ref.delete();
    setSave('저장됨', false);
  }).catch((e) => { setSave('저장 실패: ' + ((e && e.code) || e) + ' (다시 눌러 보세요)', true); });
  chain[id] = p;
}
function setSave(t, err) { const s = $('#save'); s.textContent = t; s.classList.toggle('err', !!err); clearTimeout(saveMsg); if (!err) saveMsg = setTimeout(() => { s.textContent = ''; }, 2500); }

function choose(id, k) {
  if (picks[id] === k) { delete picks[id]; k = null; } else picks[id] = k;
  paint(id); refresh(); persist(id, k);
}

function wire() {
  for (const b of document.querySelectorAll('#segView button')) b.addEventListener('click', () => { ui.v = b.dataset.v; for (const x of document.querySelectorAll('#segView button')) x.setAttribute('aria-pressed', String(x === b)); refresh(); });
  for (const b of document.querySelectorAll('#segShow button')) b.addEventListener('click', () => { ui.show = b.dataset.s; for (const x of document.querySelectorAll('#segShow button')) x.setAttribute('aria-pressed', String(x === b)); refresh(); });
  const sel = $('#selGrade'); sel.appendChild(new Option('모든 단계', 'all'));
  for (const g of [...new Set(DATA.map((r) => r.grade))]) sel.appendChild(new Option(g, g));
  sel.addEventListener('change', () => { ui.grade = sel.value; refresh(); });
  $('#q').addEventListener('input', (e) => { ui.q = e.target.value.trim(); refresh(); });
  $('#copy').addEventListener('click', async () => {
    const lines = DATA.filter((r) => picks[r.id]).map((r) => r.id + '\t' + r.ko + '\t' + picks[r.id]);
    const text = lines.join('\n');
    try { await navigator.clipboard.writeText(text); setSave('복사됨 (' + lines.length + '줄)', false); }
    catch (e) { const ta = mk('textarea'); ta.value = text; ta.rows = 8; ta.style.cssText = 'width:100%;margin-top:8px'; $('#bar').after(ta); ta.select(); setSave('복사가 막혀서 아래 상자에 띄웠습니다', true); }
  });
}

async function init() {
  build(); wire(); refresh();
  try { dbNS = window.claude && (await window.claude.use('db')); } catch (e) { dbNS = null; }
  if (!dbNS) {
    loadLocal();
    for (const id of Object.keys(picks)) { if (els[id]) paint(id); else delete picks[id]; }
    refresh(); setSave('이 브라우저에만 저장됩니다 (공유 저장 사용 불가)', true);
    return;
  }
  dbNS.collection('picks').onSnapshot((snap) => {
    const seen = {};
    for (const d of snap.docs) { const v = d.data(); if (v && els[d.id] && v.pick) { picks[d.id] = v.pick; seen[d.id] = 1; } }
    for (const id of Object.keys(picks)) if (!seen[id]) delete picks[id];
    for (const id of Object.keys(els)) paint(id);
    refresh();
  }, (e) => setSave('실시간 연결 끊김: ' + (e && e.code), true));
}
init();
</script>
