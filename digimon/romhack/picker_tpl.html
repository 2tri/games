<title>디지몬 그림 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 교정지(proof sheet) 한 장 = 디지몬 한 칸. 위에 고정 도구줄, 아래로 칸이 단계별로 이어지고, 칸마다 후보 그림 타일을 눌러 고른다. */
:root {
  --bg: #eceee9;            /* 회녹색 종이 */
  --surface: #f8f9f6;       /* 칸 바탕 */
  --ink: #1c2420;
  --muted: #5d6a63;
  --line: #cfd5cc;
  --pick: #1d5fd0;          /* 고른 것 */
  --pick-soft: #dce8fb;
  --bad: #c4372b;           /* 모두 틀림 */
  --bad-soft: #f8e1de;
  --ok: #2e7d4f;
  --warn: #8a5a00;
  --warn-soft: #f6ecd2;
  --sprite: #ffffff;        /* 스프라이트 바탕은 게임 화면처럼 늘 밝게 */
  --f-display: "Do Hyeon", "Noto Sans KR", sans-serif;
  --f-body: "Noto Sans KR", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815; --surface: #1c231f; --ink: #e5ebe6; --muted: #98a59c; --line: #323c36;
    --pick: #7aadff; --pick-soft: #1b2e4d; --bad: #ff8173; --bad-soft: #3d1f1b; --ok: #6fcf97;
    --warn: #e8c46a; --warn-soft: #3a3016; --sprite: #f1f3ee; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815; --surface: #1c231f; --ink: #e5ebe6; --muted: #98a59c; --line: #323c36;
  --pick: #7aadff; --pick-soft: #1b2e4d; --bad: #ff8173; --bad-soft: #3d1f1b; --ok: #6fcf97;
  --warn: #e8c46a; --warn-soft: #3a3016; --sprite: #f1f3ee; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 1180px; margin-inline: auto; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; margin: 20px 0 4px; letter-spacing: .01em; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 14px; max-width: 66ch; }
.lead b { color: var(--ink); font-weight: 700; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-block: 1px solid var(--line); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.prog { flex: 1 1 200px; min-width: 0; }
.prog .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.prog .meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
.prog .meter i { display: block; height: 100%; width: 0; background: var(--pick); transition: width .25s; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; padding: 6px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--pick-soft); color: var(--pick); font-weight: 700; }
select, input[type=search], .btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
input[type=search] { width: 9.5rem; }
.btn { cursor: pointer; }
.btn:hover, .seg button:hover { border-color: var(--pick); }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.save { font-size: 12px; color: var(--muted); }
.save.err { color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); flex-basis: 100%; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
#list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.gh { font-family: var(--f-display); font-size: 1.15rem; margin: 16px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
.gh small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.row.done { border-color: var(--pick); }
.rh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 10px; }
.rh .nm { font-family: var(--f-display); font-size: 1.3rem; }
.rh .id { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rh a { font-size: 12px; color: var(--pick); }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.chip.st { margin-left: auto; background: var(--pick-soft); color: var(--pick); font-weight: 700; }
.chip.st.bad { background: var(--bad-soft); color: var(--bad); }
.chip.st.half { background: var(--warn-soft); color: var(--warn); }
.gridwrap { overflow-x: auto; }
.grid { --sc: 2; display: grid; grid-template-columns: 1.6rem repeat(var(--n), max-content) minmax(5.5rem, 7rem); gap: 8px; align-items: stretch; width: max-content; max-width: 100%; }
.grid .corner { }
.side { align-self: center; justify-self: center; font-weight: 700; font-size: 13px; color: var(--muted); }
.head { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; cursor: pointer; text-align: center; white-space: normal; }
.head:hover { border-color: var(--pick); color: var(--pick); }
.head[aria-pressed="true"] { background: var(--pick-soft); color: var(--pick); font-weight: 700; }
.cell { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; position: relative; display: flex; align-items: flex-end; justify-content: center; min-width: 0; }
.cell:hover:not(:disabled) { border-color: var(--muted); }
.cell[aria-pressed="true"] { border-color: var(--pick); background: var(--pick-soft); }
.cell:disabled { cursor: not-allowed; opacity: .55; }
.cell .box { background: var(--sprite); border-radius: 4px; padding: 4px; display: flex; align-items: flex-end; justify-content: center; min-width: calc(58px * var(--sc)); min-height: calc(58px * var(--sc)); }
.cell.b .box { min-width: calc(50px * var(--sc)); min-height: calc(50px * var(--sc)); }
.cell img { image-rendering: pixelated; display: block; max-width: none; width: calc(var(--w) * var(--sc) * 1px); height: calc(var(--h) * var(--sc) * 1px); }
.cell .gone { font-size: 11px; color: #777; align-self: center; }
.cell .sel { position: absolute; top: 4px; right: 6px; font-size: 12px; font-weight: 700; color: var(--pick); }
.cell.none { border-style: dashed; align-items: center; flex-direction: column; justify-content: center; gap: 2px; text-align: center; font-size: 13px; color: var(--bad); }
.cell.none[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-soft); }
.cell.none .sel { color: var(--bad); }
.cell.none small { color: var(--muted); font-size: 11px; }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
@media (max-width: 520px) { .grid { --sc: 1.2; gap: 6px; grid-template-columns: 1.2rem repeat(var(--n), max-content) 3.8rem; } .cell { padding: 4px; } .cell.none small { display: none; } .side { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { .prog .meter i { transition: none; } }
</style>

<div class="wrap">
  <h1>디지몬 그림 고르기</h1>
  <p class="lead">칸마다 후보 그림이 있습니다. <b>맞는 그림을 한 번 누르면</b> 바로 저장됩니다. 칸마다 윗줄은 <b>앞모습</b>, 아랫줄은 <b>뒷모습</b>입니다. 앞과 뒤를 따로 눌러도 되고(앞은 DS, 뒤는 직접 올린 그림 같은 조합), 후보 이름(「현재 롬」 등)을 누르면 앞·뒤가 한 번에 골라집니다. 맞는 그림이 없으면 점선 칸을 누르세요. 이름 옆 「위키몬」 링크로 실제 모습을 볼 수 있습니다.</p>

  <div class="bar" id="bar">
    <div class="prog"><span class="num" id="pnum">0 / 0</span> <span class="save" id="save"></span><div class="meter"><i id="pbar"></i></div></div>
    <button type="button" class="btn" id="copy">결과 복사</button>
  </div>

  <div class="filters">
    <div class="seg" id="segShow" role="group" aria-label="보이는 칸">
      <button type="button" data-s="all" aria-pressed="true">전체</button><button type="button" data-s="todo" aria-pressed="false">안 고른 것</button><button type="button" data-s="recheck" aria-pressed="false">앞뒤 확인</button><button type="button" data-s="flag" aria-pressed="false">의심</button><button type="button" data-s="alt" aria-pressed="false">바꾼 것</button>
    </div>
    <select id="selGrade" aria-label="단계"></select>
    <input id="q" type="search" placeholder="이름 찾기" aria-label="이름 찾기">
  </div>

  <div id="list"></div>
</div>

<script>
const DATA = /*DATA*/[];
const LABEL = { cur: '현재 롬', bak: '이전 그림', ds: 'DS 원본', alt: '새 그림', none: '모두 틀림' };
const ui = { show: 'all', grade: 'all', q: '' };
const picks = {};            // key → { f: 'cur'|'bak'|'ds'|'alt'|'none', b: … }
const legacy = {};           // key → true: 앞뒤 따로 저장하기 전 방식으로 저장된 선택
const els = {};              // key → { row, cells: {f:{k:el}, b:{k:el}}, sels, heads, st, lg, r }
let dbNS = null, saveMsg = null;
const $ = (s) => document.querySelector(s);

function store(get) { try { return get(); } catch (e) { return null; } }
function loadLocal() { const s = store(() => localStorage.getItem('picks.v2')); try { Object.assign(picks, JSON.parse(s || '{}')); } catch (e) {} }
function saveLocal() { store(() => localStorage.setItem('picks.v2', JSON.stringify(picks))); }

function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pic(arr) {
  const box = mk('div', 'box');
  if (!arr || !arr[0]) { box.appendChild(mk('div', 'gone', '없음')); return box; }
  const im = new Image(); im.src = arr[0]; im.alt = ''; im.style.setProperty('--w', arr[1]); im.style.setProperty('--h', arr[2]);
  box.appendChild(im); return box;
}

function build() {
  const list = $('#list'); list.textContent = '';
  let lastGrade = null, head = null;
  for (const r of DATA) {
    if (r.grade !== lastGrade) { lastGrade = r.grade; head = mk('div', 'gh', r.grade); head.dataset.grade = r.grade; head._small = mk('small'); head.appendChild(head._small); list.appendChild(head); }
    const row = mk('section', 'row'); row.dataset.key = r.key; row.dataset.grade = r.grade;
    const rh = mk('div', 'rh');
    rh.appendChild(mk('span', 'nm', r.ko));
    rh.appendChild(mk('span', 'id', r.id));
    if (r.wiki) { const a = mk('a', '', '위키몬'); a.href = 'https://wikimon.net/' + encodeURIComponent(r.wiki); a.target = '_blank'; a.rel = 'noopener'; rh.appendChild(a); }
    if (r.flag) rh.appendChild(mk('span', 'chip', r.flag));
    const lg = mk('span', 'chip', '앞·뒤를 따로 골랐다면 다시 눌러 주세요'); lg.hidden = true; rh.appendChild(lg);
    const st = mk('span', 'chip st'); st.hidden = true; rh.appendChild(st);
    row.appendChild(rh);
    const gw = mk('div', 'gridwrap'), g = mk('div', 'grid'); g.style.setProperty('--n', r.tiles.length);
    const cells = { f: {}, b: {} }, sels = { f: {}, b: {} }, heads = {};
    g.appendChild(mk('div', 'corner'));
    for (const tl of r.tiles) {
      const h = mk('button', 'head', tl.label); h.type = 'button'; h.title = '앞·뒤를 같이 선택'; h.setAttribute('aria-pressed', 'false');
      h.addEventListener('click', () => choose(r.key, 'fb', tl.k)); g.appendChild(h); heads[tl.k] = h;
    }
    g.appendChild(mk('div', 'corner'));
    for (const s of ['f', 'b']) {
      g.appendChild(mk('div', 'side', s === 'f' ? '앞' : '뒤'));
      const mkSel = (c) => { const x = mk('span', 'sel', '✓'); x.hidden = true; c.appendChild(x); return x; };
      for (const tl of r.tiles) {
        const c = mk('button', 'cell ' + s); c.type = 'button'; c.setAttribute('aria-pressed', 'false');
        const arr = tl[s]; c.appendChild(pic(arr));
        if (!arr || !arr[0]) c.disabled = true;
        sels[s][tl.k] = mkSel(c);
        c.addEventListener('click', () => choose(r.key, s, tl.k)); g.appendChild(c); cells[s][tl.k] = c;
      }
      const nb = mk('button', 'cell none'); nb.type = 'button'; nb.setAttribute('aria-pressed', 'false');
      nb.appendChild(mk('span', '', '모두 틀림')); nb.appendChild(mk('small', '', '이 디지몬이 아님 · 새 그림 필요'));
      sels[s].none = mkSel(nb);
      nb.addEventListener('click', () => choose(r.key, s, 'none')); g.appendChild(nb); cells[s].none = nb;
    }
    gw.appendChild(g); row.appendChild(gw); list.appendChild(row);
    els[r.key] = { row, cells, sels, heads, st, lg, r };
  }
  const e = mk('div', 'empty', '조건에 맞는 칸이 없습니다.'); e.id = 'empty'; e.hidden = true; list.appendChild(e);
}

function sideText(k) { return LABEL[k] || k; }
function paint(key) {
  const o = els[key]; if (!o) return; const p = picks[key] || {};
  for (const sd of ['f', 'b']) for (const [k, c] of Object.entries(o.cells[sd])) {
    const on = p[sd] === k; c.setAttribute('aria-pressed', String(on)); o.sels[sd][k].hidden = !on;
  }
  for (const [k, h] of Object.entries(o.heads)) h.setAttribute('aria-pressed', String(!!p.f && p.f === k && p.b === k));
  const has = p.f || p.b, full = p.f && p.b;
  o.row.classList.toggle('done', !!full);
  o.st.hidden = !has;
  if (has) {
    o.st.textContent = p.f === p.b ? (p.f === 'cur' ? '현재 그림이 맞음' : p.f === 'none' ? '모두 틀림' : sideText(p.f) + '으로') : '앞 ' + (p.f ? sideText(p.f) : '미정') + ' · 뒤 ' + (p.b ? sideText(p.b) : '미정');
    o.st.classList.toggle('bad', p.f === 'none' && p.b === 'none');
    o.st.classList.toggle('half', !full || p.f !== p.b);
  }
  o.lg.hidden = !(legacy[key] && o.r.recheck);
}

function visible(o) {
  const r = o.r, p = picks[r.key] || {};
  if (ui.grade !== 'all' && r.grade !== ui.grade) return false;
  if (ui.q && !(r.ko.includes(ui.q) || r.id.includes(ui.q.toLowerCase()))) return false;
  if (ui.show === 'todo') return !(p.f && p.b);
  if (ui.show === 'recheck') return !!(legacy[r.key] && r.recheck);
  if (ui.show === 'flag') return !!r.flag || p.f === 'none' || p.b === 'none';
  if (ui.show === 'alt') return !!(p.f || p.b) && !(p.f === 'cur' && p.b === 'cur');
  return true;
}
function refresh() {
  let shown = 0; const perGrade = {};
  for (const o of Object.values(els)) {
    const v = visible(o); o.row.hidden = !v; if (v) { shown++; perGrade[o.r.grade] = (perGrade[o.r.grade] || 0) + 1; }
  }
  for (const h of document.querySelectorAll('.gh')) { const c = perGrade[h.dataset.grade] || 0; h.hidden = !c; h._small.textContent = c + '칸'; }
  $('#empty').hidden = shown > 0;
  const full = DATA.filter((r) => picks[r.key] && picks[r.key].f && picks[r.key].b).length;
  const half = DATA.filter((r) => picks[r.key] && (!!picks[r.key].f !== !!picks[r.key].b)).length;
  $('#pnum').textContent = full + ' / ' + DATA.length + ' 확인' + (half ? ' (한 면만 ' + half + ')' : '');
  $('#pbar').style.width = (DATA.length ? full / DATA.length * 100 : 0) + '%';
}

const chain = {};
function persist(key) {
  const p = (chain[key] || Promise.resolve()).then(async () => {
    if (!dbNS) { saveLocal(); return setSave('이 브라우저에만 저장됨', false); }
    const ref = dbNS.doc('picks/' + key), r = els[key].r, v = picks[key];
    if (v) await ref.set({ f: v.f || null, b: v.b || null, name: r.ko, id: r.id, n: r.n, grade: r.grade, at: Date.now() }); else await ref.delete();
    setSave('저장됨', false);
  }).catch((e) => { setSave('저장 실패: ' + ((e && e.code) || e) + ' (다시 눌러 보세요)', true); });
  chain[key] = p;
}
function setSave(t, err) { const s = $('#save'); s.textContent = t; s.classList.toggle('err', !!err); clearTimeout(saveMsg); if (!err) saveMsg = setTimeout(() => { s.textContent = ''; }, 2500); }

function choose(key, side, k) {
  const p = picks[key] || {};
  const sides = side === 'fb' ? ['f', 'b'] : [side];
  const same = sides.every((x) => p[x] === k);
  const np = Object.assign({}, p);
  for (const x of sides) { if (same) delete np[x]; else np[x] = k; }
  if (!np.f && !np.b) delete picks[key]; else picks[key] = np;
  delete legacy[key];
  paint(key); refresh(); persist(key);
}

function wire() {
  for (const b of document.querySelectorAll('#segShow button')) b.addEventListener('click', () => { ui.show = b.dataset.s; for (const x of document.querySelectorAll('#segShow button')) x.setAttribute('aria-pressed', String(x === b)); refresh(); });
  const sel = $('#selGrade'); sel.appendChild(new Option('모든 단계', 'all'));
  for (const g of [...new Set(DATA.map((r) => r.grade))]) sel.appendChild(new Option(g, g));
  sel.addEventListener('change', () => { ui.grade = sel.value; refresh(); });
  $('#q').addEventListener('input', (e) => { ui.q = e.target.value.trim(); refresh(); });
  $('#copy').addEventListener('click', async () => {
    const lines = DATA.filter((r) => picks[r.key]).map((r) => r.key + '\t' + r.ko + '\t앞 ' + (picks[r.key].f || '-') + '\t뒤 ' + (picks[r.key].b || '-'));
    const text = lines.join('\n');
    try { await navigator.clipboard.writeText(text); setSave('복사됨 (' + lines.length + '줄)', false); }
    catch (e) { const ta = mk('textarea'); ta.value = text; ta.rows = 8; ta.style.cssText = 'width:100%;margin-top:8px'; $('#bar').after(ta); ta.select(); setSave('복사가 막혀서 아래 상자에 띄웠습니다', true); }
  });
}

async function init() {
  build(); wire(); refresh();
  try { dbNS = window.claude && (await window.claude.use('db')); } catch (e) { dbNS = null; }
  if (!dbNS) {
    loadLocal();
    for (const k of Object.keys(picks)) { if (els[k]) paint(k); else delete picks[k]; }
    refresh(); setSave('이 브라우저에만 저장됩니다 (공유 저장 사용 불가)', true);
    return;
  }
  dbNS.collection('picks').onSnapshot((snap) => {
    const seen = {};
    for (const d of snap.docs) {
      const v = d.data(); if (!v || !els[d.id]) continue;
      if ('f' in v || 'b' in v) { const p = {}; if (v.f) p.f = v.f; if (v.b) p.b = v.b; if (p.f || p.b) { picks[d.id] = p; seen[d.id] = 1; delete legacy[d.id]; } }
      else if (v.pick) { picks[d.id] = { f: v.pick, b: v.pick }; legacy[d.id] = true; seen[d.id] = 1; }
    }
    for (const k of Object.keys(picks)) if (!seen[k]) { delete picks[k]; delete legacy[k]; }
    for (const k of Object.keys(els)) paint(k);
    refresh();
  }, (e) => setSave('실시간 연결 끊김: ' + (e && e.code), true));
}
init();
</script>
