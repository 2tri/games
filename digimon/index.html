<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c2030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>디지몬 (가제)</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#1c2030;--body:#c8c4d8;--body2:#a8a4bc;--btn:#3a3650;--ab:#9a2848;--ink:#f2eef8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 0 env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
.gb{width:min(100vw,460px);padding:14px 16px 22px;background:var(--body);border-radius:14px 14px 48px 14px;box-shadow:inset 0 -4px 0 var(--body2)}
.lcd{background:#3c3c4c;border-radius:8px 8px 28px 8px;padding:14px 14px 12px}
canvas{display:block;width:100%;aspect-ratio:160/144;image-rendering:pixelated;image-rendering:crisp-edges;background:#f8f8f8;border-radius:2px}
.brand{color:#e8e4f8;font:600 11px/1 sans-serif;letter-spacing:.12em;margin-top:8px;text-align:center;opacity:.8}
.pad{display:grid;grid-template-columns:1fr 1fr;align-items:center;margin-top:26px}
.dpad{position:relative;width:132px;height:132px}
.dpad button{position:absolute;width:44px;height:44px;border:0;background:var(--btn);color:#d8d4ec;font-size:14px}
.dpad .u{left:44px;top:0;border-radius:6px 6px 0 0}.dpad .d{left:44px;top:88px;border-radius:0 0 6px 6px}
.dpad .l{left:0;top:44px;border-radius:6px 0 0 6px}.dpad .r{left:88px;top:44px;border-radius:0 6px 6px 0}
.dpad .c{left:44px;top:44px;background:var(--btn);pointer-events:none}
.ab{position:relative;height:132px;justify-self:end;width:150px}
.ab button{position:absolute;width:62px;height:62px;border-radius:50%;border:0;background:var(--ab);color:#f8e8f0;font:700 18px sans-serif;box-shadow:0 3px 0 #5a1028}
.ab .b{left:0;top:52px}.ab .a{right:0;top:14px}
.sys{display:flex;justify-content:center;gap:26px;margin-top:22px}
.sys button{width:64px;height:20px;border-radius:10px;border:0;background:#8a86a0;color:#2a2838;font:700 10px sans-serif;letter-spacing:.06em;transform:rotate(-20deg)}
button.on{filter:brightness(1.35)}
.note{color:#8a86a0;font-size:11px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="gb">
  <div class="lcd"><canvas id="scr" width="160" height="144"></canvas></div>
  <div class="brand">DIGITAL MONSTER · FAN GAME</div>
  <div class="pad">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="위">▲</button>
      <button class="l" data-k="left" aria-label="왼쪽">◀</button>
      <button class="c" tabindex="-1" aria-hidden="true"></button>
      <button class="r" data-k="right" aria-label="오른쪽">▶</button>
      <button class="d" data-k="down" aria-label="아래">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-k="b">B</button>
      <button class="a" data-k="a">A</button>
    </div>
  </div>
  <div class="sys"><button data-k="select">SELECT</button><button data-k="start">START</button></div>
  <div class="note">비공식 팬 게임 · 키보드: 방향키 / Z=A / X=B / Enter=START</div>
</div>
<script src="font.js"></script>
<script src="pix.js"></script>
<script src="mons.js"></script>
<script src="field.js"></script>
<script src="ui.js"></script>
<script src="species.js"></script>
<script src="art.js"></script>
<script src="story.js"></script>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
