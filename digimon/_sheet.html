<!doctype html><meta charset="utf-8"><body style="margin:0;background:#f4f1e8">
<canvas id="c" width="1500" height="10"></canvas>
<script src="pix.js"></script>
<script src="mons.js"></script>
<script>
// 디지몬 그림 모아 보기 — 크게(6배) 그리고 아래에 실제 크기(1배)·폰 크기(3배)
// 주소 끝에 ?only=agumon,greymon 처럼 붙이면 그것만 크게(10배·눈금) 본다
const MON=Object.assign({},DigiMons.MON,window.DigiPeople?DigiPeople.PEOPLE:{}), {toCanvas}=DigiPix, c=document.getElementById('c'), g=c.getContext('2d');
const only=(new URLSearchParams(location.search).get('only')||'').split(',').filter(Boolean);
const keys=only.length?only:Object.keys(MON), SC=only.length?10:6, CELL=56*SC+20;
const perRow=Math.max(1,Math.floor(1480/CELL)); c.height=Math.ceil(keys.length/perRow)*(CELL+200)+20;
g.imageSmoothingEnabled=false; g.font='bold 18px sans-serif'; g.textAlign='center';
keys.forEach((k,i)=>{ const s=MON[k](); const x=20+(i%perRow)*CELL, y=20+Math.floor(i/perRow)*(CELL+200);
  g.fillStyle='#fff'; g.fillRect(x,y,56*SC,56*SC);
  const ox=x+(56-s.w)*SC/2, oy=y+(56-s.h)*SC;
  g.drawImage(toCanvas(s,SC),ox,oy);
  if(only.length){ g.strokeStyle='rgba(0,0,0,.12)'; g.lineWidth=1; for(let j=0;j<=s.w;j++){g.beginPath();g.moveTo(ox+j*SC+.5,oy);g.lineTo(ox+j*SC+.5,oy+s.h*SC);g.stroke();} for(let j=0;j<=s.h;j++){g.beginPath();g.moveTo(ox,oy+j*SC+.5);g.lineTo(ox+s.w*SC,oy+j*SC+.5);g.stroke();} }
  g.fillStyle='#222'; g.fillText(k+' '+s.w+'×'+s.h,x+28*SC,y+56*SC+24);
  g.drawImage(toCanvas(s,1),x,y+56*SC+40); g.drawImage(toCanvas(s,3),x+70,y+56*SC+40); });
</script>
