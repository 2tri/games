<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="반지 원정">
<meta name="theme-color" content="#2b2f3a">
<title>반지 원정</title>
<style>
@font-face{font-family:Galmuri9;src:url(Galmuri9.woff2) format('woff2')}
:root{--body:#c9c5bc;--body2:#b7b2a8;--ink:#2b2f3a;--btn:#8b2c4a;--bezel:#5d6170;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--body);font-family:Galmuri9,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
.gb{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(6px + var(--safe-t)) 6px calc(8px + var(--safe-b))}
.bezel{background:var(--bezel);border-radius:8px 8px 22px 8px;padding:8px 8px 4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
/* 화면은 남는 높이에 맞춰 최대한 크게 (버튼 영역 약 200px 남김) */
canvas{display:block;width:min(100%, calc((100dvh - 250px - var(--safe-t) - var(--safe-b)) * 160 / 144));margin:0 auto;aspect-ratio:160/144;image-rendering:pixelated;background:#f8f8f0;border-radius:2px}
.brand{color:#d8d4ca;font-size:10px;letter-spacing:.08em;margin-top:3px;opacity:.8}
.pad{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:8px 10px 0;gap:4px 0}
.dpad{position:relative;width:126px;height:126px}
.dpad button{position:absolute;width:42px;height:42px;background:#2b2f3a;border:0;border-radius:6px;box-shadow:0 3px 0 #15171d}
.dpad .u{left:42px;top:0}.dpad .d{left:42px;bottom:0}.dpad .l{left:0;top:42px}.dpad .r{right:0;top:42px}
.dpad .c{left:42px;top:42px;width:42px;height:42px;background:#2b2f3a;position:absolute}
.ab{justify-self:end;position:relative;width:140px;height:100px;transform:rotate(-24deg)}
.ab button{position:absolute;width:56px;height:56px;border-radius:50%;background:var(--btn);border:0;color:#f0e6ea;font:bold 18px Galmuri9,sans-serif;box-shadow:0 4px 0 #57182c}
.ab .a{right:0;top:0}.ab .b{left:0;top:32px}
.ss{grid-column:1/3;display:flex;justify-content:center;gap:26px}
.ss button{width:56px;height:14px;border-radius:7px;border:0;background:#6d7180;transform:rotate(-24deg);box-shadow:0 2px 0 #44474f}
.ss span{display:block;font-size:9px;text-align:center;margin-top:6px;color:#6d7180;letter-spacing:.06em}
button:active,button.on{filter:brightness(1.35);transform-origin:center}
</style>
</head>
<body>
<div class="gb">
  <div class="bezel"><canvas id="cv" width="160" height="144"></canvas><div class="brand">반지 원정 · 비공식 팬 게임</div></div>
  <div class="pad">
    <div class="dpad"><button class="u" data-k="up"></button><button class="l" data-k="left"></button><div class="c"></div><button class="r" data-k="right"></button><button class="d" data-k="down"></button></div>
    <div class="ab"><button class="b" data-k="b">B</button><button class="a" data-k="a">A</button></div>
    <div class="ss"><div><button data-k="select"></button><span>SELECT</span></div><div><button data-k="start"></button><span>START</span></div></div>
  </div>
</div>
<script src="ai/sprites.js"></script>
<script>
'use strict';
// ═════════ 화면·그리기 ═════════
const PAL = ['#f8f8f0', '#b0b0a8', '#606060', '#181818'];
const cv = document.getElementById('cv'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const sprCache = {};
function sprite(name) {
  if (sprCache[name]) return sprCache[name];
  const t = AISPR[name], h = t.length, w = t[0].length, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x2 = c.getContext('2d'); const im = x2.createImageData(w, h);
  const rgb = PAL.map(p => [parseInt(p.slice(1, 3), 16), parseInt(p.slice(3, 5), 16), parseInt(p.slice(5, 7), 16)]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = t[y][x], i = (y * w + x) * 4; if (v >= 0) { im.data[i] = rgb[v][0]; im.data[i + 1] = rgb[v][1]; im.data[i + 2] = rgb[v][2]; im.data[i + 3] = 255; } }
  x2.putImageData(im, 0, 0); return (sprCache[name] = c);
}
function flashSprite(name) {   // 맞았을 때 하얗게
  const k = name + '#w'; if (sprCache[k]) return sprCache[k];
  const s = sprite(name), c = document.createElement('canvas'); c.width = s.width; c.height = s.height; const x2 = c.getContext('2d');
  x2.drawImage(s, 0, 0); x2.globalCompositeOperation = 'source-in'; x2.fillStyle = PAL[0]; x2.fillRect(0, 0, c.width, c.height);
  return (sprCache[k] = c);
}
const txtCache = {};
function textImg(s, col) {
  const k = s + '|' + col; if (txtCache[k]) return txtCache[k];
  const c = document.createElement('canvas'), x2 = c.getContext('2d'); x2.font = '10px Galmuri9';
  const w = Math.ceil(x2.measureText(s).width) + 2; c.width = Math.max(1, w); c.height = 13;
  x2.font = '10px Galmuri9'; x2.textBaseline = 'top'; x2.fillStyle = PAL[col ?? 3]; x2.fillText(s, 0, 1);
  const d = x2.getImageData(0, 0, c.width, 13); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 110 ? 255 : 0; x2.putImageData(d, 0, 0);
  return (txtCache[k] = c);
}
const text = (s, x, y, col) => g.drawImage(textImg(s, col), x, y);
const tw = s => textImg(s, 3).width - 2;
function rect(x, y, w, h, c) { g.fillStyle = PAL[c]; g.fillRect(x, y, w, h); }
function box(x, y, w, h) { rect(x, y, w, h, 3); rect(x + 1, y + 1, w - 2, h - 2, 0); rect(x + 3, y + 3, w - 6, 1, 3); rect(x + 3, y + h - 4, w - 6, 1, 3); rect(x + 3, y + 3, 1, h - 6, 3); rect(x + w - 4, y + 3, 1, h - 6, 3); }
function wrap(s, maxw) {
  const out = []; for (const para of s.split('\n')) {
    let line = ''; for (const word of para.split(' ')) {
      const t2 = line ? line + ' ' + word : word;
      if (tw(t2) <= maxw) line = t2; else { if (line) out.push(line); line = word; while (tw(line) > maxw) { let i = line.length; while (i > 1 && tw(line.slice(0, i)) > maxw) i--; out.push(line.slice(0, i)); line = line.slice(i); } }
    } out.push(line);
  } return out;
}
// 받침에 따른 조사
function josa(w, a, b) { const c = w.charCodeAt(w.length - 1); if (c < 0xac00 || c > 0xd7a3) return w + b; return w + ((c - 0xac00) % 28 ? a : b); }

// ═════════ 입력 ═════════
const held = {}; let keyWaiters = [];
function press(k) { const ws = keyWaiters; keyWaiters = []; ws.forEach(f => f(k)); }
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); press(k); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('on')));
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); press('a'); });
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', z: 'a', Z: 'a', Enter: 'start', x: 'b', X: 'b', ' ': 'a', Backspace: 'b', Shift: 'select' };
addEventListener('keydown', e => { const k = KEYMAP[e.key]; if (k) { e.preventDefault(); press(k); } });
const nextKey = () => new Promise(r => keyWaiters.push(r));
const wait = ms => new Promise(r => setTimeout(r, ms));

// ═════════ 장면 (그리기 함수만 바꿔 끼움) ═════════
let scene = () => rect(0, 0, 160, 144, 0);
let msg = null;          // {lines, shown}
let menu = null;         // 그리기 콜백
function frame(t) { g.clearRect(0, 0, 160, 144); scene(t); if (menu) menu(t); else if (msg) drawMsg(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function drawMsg(t) {
  box(0, 96, 160, 48);
  const [a, b] = msg.lines; let left = Math.floor(msg.shown);
  const a2 = (a || '').slice(0, left); left -= (a || '').length; const b2 = left > 0 ? (b || '').slice(0, left) : '';
  if (a2) text(a2, 8, 105); if (b2) text(b2, 8, 121);
  msg.shown += 1.2;
  if (msg.shown >= (a || '').length + (b || '').length && msg.more && Math.floor(t / 300) % 2) { rect(148, 133, 5, 2, 3); rect(149, 135, 3, 1, 3); rect(150, 136, 1, 1, 3); }
}
// 대사: 두 줄씩 넘기며 보여 줌
async function say(s, opt) {
  const lines = wrap(s, 144);
  for (let i = 0; i < lines.length; i += 2) {
    msg = { lines: [lines[i], lines[i + 1]], shown: 0, more: true };
    for (;;) { const k = await nextKey(); if (k === 'a' || k === 'b') { const full = (lines[i] || '').length + (lines[i + 1] || '').length; if (msg.shown < full) msg.shown = full; else break; } }
  }
  if (!(opt && opt.keep)) msg = null;
}
async function sayAuto(s, ms) { const lines = wrap(s, 144); msg = { lines: [lines[0], lines[1]], shown: 999, more: false }; await wait(ms || 700); msg = null; }
// 고르기 (대사창 위 오른쪽 상자)
async function choose(question, opts, cancel) {
  const ql = question ? wrap(question, 144) : [];
  let i = 0; const w = Math.max(...opts.map(tw)) + 22, h = opts.length * 14 + 10, x = 160 - w, y = 96 - h;
  menu = () => { box(0, 96, 160, 48); if (question) { if (ql[0]) text(ql[0], 8, 105); if (ql[1]) text(ql[1], 8, 121); }
    box(x, y, w, h); opts.forEach((o, k) => { text(o, x + 14, y + 6 + k * 14); if (k === i) text('▶', x + 5, y + 6 + k * 14); }); };
  for (;;) { const k = await nextKey();
    if (k === 'up') i = (i + opts.length - 1) % opts.length; else if (k === 'down') i = (i + 1) % opts.length;
    else if (k === 'a' || k === 'start') { menu = null; return i; } else if (k === 'b' && cancel !== undefined) { menu = null; return cancel; } }
}

  gimli: { name: '김리', full: '김리', hp: 40, atk: 15, def: 14, spd: 7, desc: ['외로운 산의 난쟁이 전사', '도끼 한 자루면 충분하다'], moves: ['chop', 'stubborn', 'headbutt', 'roar'] },

async function tween(obj, key, to, ms) { const from = obj[key], t0 = performance.now(); for (;;) { const k = Math.min(1, (performance.now() - t0) / ms); obj[key] = from + (to - from) * k; if (k >= 1) break; await wait(16); } }

async function battle(foeId, opt) {

async function heroTurn(act) {

    return;
  }
  const mv = MOVES[act.id];
  await say(H.name + '의 ' + mv.name + '!', { keep: true });
  if (mv.line) await say(mv.line, { keep: true });

    S.shadow++; st.hide = true;

    const r = dmgCalc(mv, stat('atk') * (1 + S.buff.atk * 0.25), B.foe.def * (1 + B.foe.buff.def * 0.25), S.lv, B.foe.type);

async function foeTurn() {

  if (Math.random() * 100 > mv.acc) { await say('빗나갔다!'); return; }
  const r = dmgCalc(mv, F.atk * (1 + F.buff.atk * 0.25), stat('def') * (1 + S.buff.def * 0.25), F.lv, '');

    await say('프로도가 반지를 꼈다. 모르도르 전체가 그를 향해 눈을 돌렸다.');
    await say('보이지 않는 프로도에게 골룸이 달려들어 손가락을 물어뜯었다! 반지를 되찾은 골룸이 기뻐 날뛰다... 발을 헛디뎠다.');
    await say('골룸과 반지가 함께 불 속으로 떨어졌다. 반지가 녹아내리며 마지막으로 빛났다.');
    await story('운명의 산', 'frodosam_front', [
      '땅이 흔들리고 바랏두르의 탑이 무너져 내렸다. 거대한 눈이 꺼졌다.',
      '용암이 흐르는 바위 위에서 프로도와 샘은 서로 손을 잡았다.',
      '프로도: 함께 있어서 다행이야, 샘. 모든 게 끝나는 곳에서.',
      '그때 하늘에서 큰독수리들이 내려왔다. 그 등에는 흰 옷의 간달프가 타고 있었다.',
    ]);
    S.step = 38; save();
  },
  async () => {
    await story('미나스 티리스', 'aragorn_front', [
      '눈을 뜨자 간달프가 웃고 있었다. 이어 메리, 피핀, 레골라스, 김리가 문을 열고 뛰어들었다.',
      '아라곤이 곤도르의 왕관을 썼다. 그리고 네 호빗 앞에서 무릎을 꿇었다. 「그대들은 누구에게도 고개 숙일 필요가 없소.」',
      '온 도시가 따라 무릎을 꿇었다.',
    ]);
    await chapterTitle('제3부 「왕의 귀환」 끝', '반지는 사라졌다');
    S.step = 39; save();
  },
  async () => {
    await chapterTitle('덧붙이는 장', '샤이어 소탕');
    await story('브랜디와인 다리', 'merrypippin_front', [
      '네 호빗이 고향으로 돌아왔다. 그런데 다리에 낯선 문이 세워져 있고, 「샤키 두목의 명령」이라는 팻말이 붙어 있었다.',
      '나무는 베이고, 굴뚝마다 시커먼 연기. 거울에서 본 그대로였다.',
      '메리: 원정에서 배운 게 하나 있다면, 이런 건 그냥 두면 안 된다는 거지.',
      '메리가 로한의 뿔나팔을 불었다. 샤이어 곳곳의 호빗들이 쇠스랑과 몽둥이를 들고 모여들었다.',
    ]);
    await story('골목쟁이집 앞', 'sharkey', [
      '골목쟁이집 앞에 지저분한 옷을 입은 노인이 서 있었다. 몰락한 사루만, 「샤키」였다.',
      '샤키: 어서 오게, 반지 지기. 자네 고향을 내 마음대로 바꿔 보았지.',
    ]);
    const r = await battle('sharkey', { noRun: true }); if (r === 'lose') return lose();
    await story('골목쟁이집 앞', 'frodosam_front', [
      '호빗들이 사루만을 둘러쌌다. 프로도가 손을 들어 막았다. 「죽이지 마. 그는 한때 위대했어. 이제는 그저 가엾을 뿐이야.」',
      '사루만은 아무 말 없이 떠났고, 그날로 샤이어에서 사라졌다.',
      '샘은 갈라드리엘에게 받은 흙 상자를 열어 베어진 나무 자리마다 한 줌씩 뿌렸다. 이듬해 봄, 샤이어는 그 어느 때보다 푸르렀다.',
    ]);
    S.step = 40; save();
  },
  async () => {
    await story('회색 항구', 'galadriel_front', [
      '몇 해 뒤. 바람마루의 상처는 해마다 같은 날이면 다시 아려 왔다.',
      '프로도는 빌보, 간달프, 요정들과 함께 바다 건너 서쪽으로 떠나기로 했다.',
      '프로도: 샤이어를 지켜 냈어, 샘. 하지만 나를 위해서는 아니었나 봐.',
      '프로도는 샘에게 붉은 책을 건넸다. 「남은 쪽은 네가 채워 줘.」',
      '배가 수평선 너머로 사라졌다. 샘은 집으로 돌아가 문을 열었다. 「다녀왔어.」',
    ]);
    await chapterTitle('반지 원정 · 끝', `여정의 그림자 ${S.shadow} · 레벨 ${S.lv}`);
    await say('끝까지 함께해 주셔서 고맙습니다. 저장되었습니다.');
    S.step = 41; S.done = true; save();
  },
];
const PRACTICE_INTRO = {
  aragorn: ['브리의 「달리는 조랑말」 구석 자리. 두건을 깊이 쓴 순찰자가 문 쪽을 지켜보고 있다.', '그의 이야기는 아직 준비 중이다. 대신 연습 전투를 해 보자.'],
  legolas: ['어둠숲 요정 왕의 궁전. 붙잡아 두었던 골룸이 달아났다는 소식이 들어왔다.', '그의 이야기는 아직 준비 중이다. 대신 연습 전투를 해 보자.'],
  gimli: ['외로운 산. 모르도르에서 온 사자가 난쟁이 왕에게 반지를 캐물었다.', '그의 이야기는 아직 준비 중이다. 대신 연습 전투를 해 보자.'],
  gandalf: ['미나스 티리스의 서고. 먼지 쌓인 두루마리에서 반지의 비밀을 찾아냈다.', '그의 이야기는 아직 준비 중이다. 대신 연습 전투를 해 보자.'],
};
async function practice() {
  await story(null, S.hero + '_front', PRACTICE_INTRO[S.hero]);
  for (;;) {
    scene = storyScene('연습 전투', S.hero + '_front');
    const ids = Object.keys(FOES).sort((a, b) => FOES[a].lv - FOES[b].lv);
    const k = await choose('누구와 겨뤄 볼까?', ids.map(i => FOES[i].name + ' ' + FOES[i].lv).concat(['그만하기']));
    if (k === ids.length) return;
    const r = await battle(ids[k]);
    if (r === 'lose') { await lose(); }
    S.hp = stat('hp'); save();
  }
}

// ═════════ 제목·인물 선택 ═════════
async function title() {
  const has = load();
  let blink = 0;
  scene = t => {
    rect(0, 0, 160, 144, 0);
    const big = '반지 원정'; g.save(); g.scale(2, 2); g.drawImage(textImg(big, 3), 40 - tw(big) / 2, 8); g.restore();
    text('— 가운데땅 팬 게임 —', 80 - tw('— 가운데땅 팬 게임 —') / 2, 40, 2);
    const s = sprite('gandalf_front'); g.drawImage(s, 80 - s.width / 2, 116 - s.height);
    if (Math.floor(t / 500) % 2) text('START', 80 - tw('START') / 2, 126);
  };
  msg = null;
  for (;;) { const k = await nextKey(); if (k === 'start' || k === 'a') break; }
  if (has) { const c = await choose(null, ['이어하기', '새로 시작']); if (c === 0) { S = has; return; } }
  S = newState(await pickHero());
  save();
}
async function pickHero() {
  const ids = Object.keys(HEROES); let i = 0;
  scene = t => {
    rect(0, 0, 160, 144, 0);
    box(0, 0, 160, 20); const h = HEROES[ids[i]]; text('누구의 이야기를 따라갈까?', 80 - tw('누구의 이야기를 따라갈까?') / 2, 5);
    const s = sprite(ids[i] + '_front'); g.drawImage(s, 80 - s.width / 2, 92 - s.height);
    text('◀', 4, 56); text('▶', 148, 56);
    box(0, 96, 160, 48); text(h.full, 8, 102); text(h.desc[0], 8, 116, 2); text(h.desc[1], 8, 128, 2);
    for (let k = 0; k < ids.length; k++) rect(70 + k * 5, 90, 3, 3, k === i ? 3 : 1);
  };
  msg = null;
  for (;;) {
    const k = await nextKey();
    if (k === 'left') i = (i + ids.length - 1) % ids.length; else if (k === 'right') i = (i + 1) % ids.length;
    else if (k === 'a' || k === 'start') { const nm = HEROES[ids[i]].full, cc = nm.charCodeAt(nm.length - 1), ro = (cc - 0xac00) % 28 && (cc - 0xac00) % 28 !== 8 ? '으로' : '로';
      const c = await choose(nm + ro + ' 시작할까?', ['예', '아니오'], 1); if (c === 0) return ids[i]; }
  }
}

// ═════════ 시작 ═════════
(async function main() {
  await document.fonts.load('10px Galmuri9');
  for (;;) {
    await title();
    if (S.lead === 'frodosam') {
      while (S.step < CH1.length) { const before = S.step; await CH1[S.step](); if (S.step === before) { /* 패배: 같은 장면 다시 */ } }
      await say('START를 누르면 제목으로 돌아갑니다.'); await nextKey();
    } else await practice();
  }
})();
</script>
