<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="반지 원정">
<meta name="theme-color" content="#2b2f3a">
<title>반지 원정</title>
<style>
@font-face{font-family:Galmuri9;src:url(Galmuri9.woff2) format('woff2')}
:root{--body:#c9c5bc;--body2:#b7b2a8;--ink:#2b2f3a;--btn:#8b2c4a;--bezel:#5d6170;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--body);font-family:Galmuri9,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
.gb{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + var(--safe-t)) 14px calc(14px + var(--safe-b))}
.bezel{background:var(--bezel);border-radius:10px 10px 36px 10px;padding:14px 16px 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
canvas{display:block;width:100%;aspect-ratio:160/144;image-rendering:pixelated;background:#f8f8f0;border-radius:2px}
.brand{color:#d8d4ca;font-size:11px;letter-spacing:.08em;margin-top:6px;text-align:left;opacity:.85}
.pad{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:18px 6px 6px;min-height:230px}
.dpad{position:relative;width:132px;height:132px}
.dpad button{position:absolute;width:44px;height:44px;background:#2b2f3a;border:0;border-radius:6px;box-shadow:0 3px 0 #15171d}
.dpad .u{left:44px;top:0}.dpad .d{left:44px;bottom:0}.dpad .l{left:0;top:44px}.dpad .r{right:0;top:44px}
.dpad .c{left:44px;top:44px;width:44px;height:44px;background:#2b2f3a;position:absolute;border-radius:0}
.ab{justify-self:end;position:relative;width:150px;height:110px;transform:rotate(-24deg)}
.ab button{position:absolute;width:58px;height:58px;border-radius:50%;background:var(--btn);border:0;color:#f0e6ea;font:bold 18px Galmuri9,sans-serif;box-shadow:0 4px 0 #57182c}
.ab .a{right:0;top:0}.ab .b{left:0;top:34px}
.ss{grid-column:1/3;display:flex;justify-content:center;gap:26px;margin-top:6px}
.ss button{width:62px;height:16px;border-radius:8px;border:0;background:#6d7180;transform:rotate(-24deg);box-shadow:0 2px 0 #44474f}
.ss span{display:block;font-size:10px;text-align:center;margin-top:8px;color:#6d7180;letter-spacing:.06em}
button:active,button.on{filter:brightness(1.35);transform-origin:center}
</style>
</head>
<body>
<div class="gb">
  <div class="bezel"><canvas id="cv" width="160" height="144"></canvas><div class="brand">반지 원정 · 비공식 팬 게임</div></div>
  <div class="pad">
    <div class="dpad"><button class="u" data-k="up"></button><button class="l" data-k="left"></button><div class="c"></div><button class="r" data-k="right"></button><button class="d" data-k="down"></button></div>
    <div class="ab"><button class="b" data-k="b">B</button><button class="a" data-k="a">A</button></div>
    <div class="ss"><div><button data-k="select"></button><span>SELECT</span></div><div><button data-k="start"></button><span>START</span></div></div>
  </div>
</div>
<script src="ai/sprites.js"></script>
<script>
'use strict';
// ═════════ 화면·그리기 ═════════
const PAL = ['#f8f8f0', '#b0b0a8', '#606060', '#181818'];
const cv = document.getElementById('cv'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const sprCache = {};
function sprite(name) {
  if (sprCache[name]) return sprCache[name];
  const t = AISPR[name], h = t.length, w = t[0].length, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x2 = c.getContext('2d'); const im = x2.createImageData(w, h);
  const rgb = PAL.map(p => [parseInt(p.slice(1, 3), 16), parseInt(p.slice(3, 5), 16), parseInt(p.slice(5, 7), 16)]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = t[y][x], i = (y * w + x) * 4; if (v >= 0) { im.data[i] = rgb[v][0]; im.data[i + 1] = rgb[v][1]; im.data[i + 2] = rgb[v][2]; im.data[i + 3] = 255; } }
  x2.putImageData(im, 0, 0); return (sprCache[name] = c);
}
function flashSprite(name) {   // 맞았을 때 하얗게
  const k = name + '#w'; if (sprCache[k]) return sprCache[k];
  const s = sprite(name), c = document.createElement('canvas'); c.width = s.width; c.height = s.height; const x2 = c.getContext('2d');
  x2.drawImage(s, 0, 0); x2.globalCompositeOperation = 'source-in'; x2.fillStyle = PAL[0]; x2.fillRect(0, 0, c.width, c.height);
  return (sprCache[k] = c);
}
const txtCache = {};
function textImg(s, col) {
  const k = s + '|' + col; if (txtCache[k]) return txtCache[k];
  const c = document.createElement('canvas'), x2 = c.getContext('2d'); x2.font = '10px Galmuri9';
  const w = Math.ceil(x2.measureText(s).width) + 2; c.width = Math.max(1, w); c.height = 13;
  x2.font = '10px Galmuri9'; x2.textBaseline = 'top'; x2.fillStyle = PAL[col ?? 3]; x2.fillText(s, 0, 1);
  const d = x2.getImageData(0, 0, c.width, 13); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 110 ? 255 : 0; x2.putImageData(d, 0, 0);
  return (txtCache[k] = c);
}
const text = (s, x, y, col) => g.drawImage(textImg(s, col), x, y);
const tw = s => textImg(s, 3).width - 2;
function rect(x, y, w, h, c) { g.fillStyle = PAL[c]; g.fillRect(x, y, w, h); }
function box(x, y, w, h) { rect(x, y, w, h, 3); rect(x + 1, y + 1, w - 2, h - 2, 0); rect(x + 3, y + 3, w - 6, 1, 3); rect(x + 3, y + h - 4, w - 6, 1, 3); rect(x + 3, y + 3, 1, h - 6, 3); rect(x + w - 4, y + 3, 1, h - 6, 3); }
function wrap(s, maxw) {
  const out = []; for (const para of s.split('\n')) {
    let line = ''; for (const word of para.split(' ')) {
      const t2 = line ? line + ' ' + word : word;
      if (tw(t2) <= maxw) line = t2; else { if (line) out.push(line); line = word; while (tw(line) > maxw) { let i = line.length; while (i > 1 && tw(line.slice(0, i)) > maxw) i--; out.push(line.slice(0, i)); line = line.slice(i); } }
    } out.push(line);
  } return out;
}
// 받침에 따른 조사
function josa(w, a, b) { const c = w.charCodeAt(w.length - 1); if (c < 0xac00 || c > 0xd7a3) return w + b; return w + ((c - 0xac00) % 28 ? a : b); }

// ═════════ 입력 ═════════
const held = {}; let keyWaiters = [];
function press(k) { const ws = keyWaiters; keyWaiters = []; ws.forEach(f => f(k)); }
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); press(k); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('on')));
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); press('a'); });
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', z: 'a', Z: 'a', Enter: 'start', x: 'b', X: 'b', ' ': 'a', Backspace: 'b', Shift: 'select' };
addEventListener('keydown', e => { const k = KEYMAP[e.key]; if (k) { e.preventDefault(); press(k); } });
const nextKey = () => new Promise(r => keyWaiters.push(r));
const wait = ms => new Promise(r => setTimeout(r, ms));

// ═════════ 장면 (그리기 함수만 바꿔 끼움) ═════════
let scene = () => rect(0, 0, 160, 144, 0);
let msg = null;          // {lines, shown}
let menu = null;         // 그리기 콜백
function frame(t) { g.clearRect(0, 0, 160, 144); scene(t); if (menu) menu(t); else if (msg) drawMsg(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function drawMsg(t) {
  box(0, 96, 160, 48);
  const [a, b] = msg.lines; let left = Math.floor(msg.shown);
  const a2 = (a || '').slice(0, left); left -= (a || '').length; const b2 = left > 0 ? (b || '').slice(0, left) : '';
  if (a2) text(a2, 8, 105); if (b2) text(b2, 8, 121);
  msg.shown += 1.2;
  if (msg.shown >= (a || '').length + (b || '').length && msg.more && Math.floor(t / 300) % 2) { rect(148, 133, 5, 2, 3); rect(149, 135, 3, 1, 3); rect(150, 136, 1, 1, 3); }
}
// 대사: 두 줄씩 넘기며 보여 줌
async function say(s, opt) {
  const lines = wrap(s, 144);
  for (let i = 0; i < lines.length; i += 2) {
    msg = { lines: [lines[i], lines[i + 1]], shown: 0, more: true };
    for (;;) { const k = await nextKey(); if (k === 'a' || k === 'b') { const full = (lines[i] || '').length + (lines[i + 1] || '').length; if (msg.shown < full) msg.shown = full; else break; } }
  }
  if (!(opt && opt.keep)) msg = null;
}
async function sayAuto(s, ms) { const lines = wrap(s, 144); msg = { lines: [lines[0], lines[1]], shown: 999, more: false }; await wait(ms || 700); msg = null; }
// 고르기 (대사창 위 오른쪽 상자)
async function choose(question, opts, cancel) {
  const ql = question ? wrap(question, 144) : [];
  let i = 0; const w = Math.max(...opts.map(tw)) + 22, h = opts.length * 14 + 10, x = 160 - w, y = 96 - h;
  menu = () => { box(0, 96, 160, 48); if (question) { if (ql[0]) text(ql[0], 8, 105); if (ql[1]) text(ql[1], 8, 121); }
    box(x, y, w, h); opts.forEach((o, k) => { text(o, x + 14, y + 6 + k * 14); if (k === i) text('▶', x + 5, y + 6 + k * 14); }); };
  for (;;) { const k = await nextKey();
    if (k === 'up') i = (i + opts.length - 1) % opts.length; else if (k === 'down') i = (i + 1) % opts.length;
    else if (k === 'a' || k === 'start') { menu = null; return i; } else if (k === 'b' && cancel !== undefined) { menu = null; return cancel; } }
}

// ═════════ 자료: 인물·기술·적 ═════════
const HEROES = {
  frodosam: { name: '프로도·샘', full: '프로도와 샘', hp: 30, atk: 10, def: 9, spd: 9, desc: ['반지를 맡은 호빗과', '끝까지 곁을 지키는 정원사'],
    moves: ['staff', 'pan', 'ring', 'stand'] },
  aragorn: { name: '아라곤', full: '아라곤', hp: 36, atk: 14, def: 11, spd: 11, desc: ['북쪽의 순찰자', '성큼걸이라 불리는 사내'], moves: ['slash', 'strider', 'athelas', 'torch'] },
  legolas: { name: '레골라스', full: '레골라스', hp: 30, atk: 13, def: 9, spd: 15, desc: ['어둠숲 요정 왕의 아들', '활을 쏘면 빗나가지 않는다'], moves: ['twin', 'aim', 'elfeye', 'knife'] },
  gimli: { name: '김리', full: '김리', hp: 40, atk: 15, def: 14, spd: 7, desc: ['외로운 산의 난쟁이 전사', '도끼 한 자루면 충분하다'], moves: ['chop', 'stubborn', 'headbutt', 'roar'] },
  gandalf: { name: '간달프', full: '간달프', hp: 34, atk: 12, def: 10, spd: 10, desc: ['회색의 마법사', '반지의 비밀을 쫓는다'], moves: ['light', 'glamdring', 'fire', 'cleanse'] },
};
// kind: hit(피해) / heal / buff / hide(반지) ; elem: 보통·불·빛
const MOVES = {
  staff: { name: '지팡이 휘두르기', pow: 9, acc: 95 }, pan: { name: '프라이팬', pow: 12, acc: 85, line: '샘이 프라이팬을 힘껏 휘둘렀다!' },
  ring: { name: '반지 끼기', kind: 'hide' }, stand: { name: '함께 버티기', kind: 'buff', stat: 'def', line: '둘이 등을 맞대고 버틴다!' },
  slash: { name: '장검 베기', pow: 13, acc: 95 }, strider: { name: '성큼걸이 일격', pow: 10, acc: 90, crit: 35 },
  athelas: { name: '아셀라스', kind: 'heal', amt: 0.45, line: '향긋한 풀잎으로 상처를 다스렸다.' }, torch: { name: '횃불', pow: 10, acc: 90, elem: '불' },
  twin: { name: '두 발 쏘기', pow: 7, acc: 90, hits: 2 }, aim: { name: '정조준', pow: 14, acc: 100 },
  elfeye: { name: '요정의 눈', kind: 'buff', stat: 'atk', line: '날카로운 눈이 빈틈을 찾는다!' }, knife: { name: '긴 칼', pow: 11, acc: 95 },
  chop: { name: '도끼 내리찍기', pow: 17, acc: 75 }, stubborn: { name: '난쟁이 고집', kind: 'buff', stat: 'def', line: '김리는 꿈쩍도 하지 않는다!' },
  headbutt: { name: '투구 박치기', pow: 10, acc: 95 }, roar: { name: '함성', kind: 'buff', stat: 'atk', line: '크하자드둠을 향해 외쳤다!' },
  light: { name: '지팡이 빛', pow: 10, acc: 100, elem: '빛' }, glamdring: { name: '글람드링', pow: 13, acc: 95 },
  fire: { name: '불꽃', pow: 11, acc: 90, elem: '불' }, cleanse: { name: '정화', kind: 'heal', amt: 0.35, line: '맑은 빛이 상처를 감싼다.', cure: true },
  // 적 기술
  bite: { name: '물기', pow: 8, acc: 90 }, growl: { name: '으르렁', kind: 'debuff', stat: 'def', line: '이빨을 드러내며 으르렁댔다!' },
  root: { name: '뿌리 조르기', pow: 9, acc: 90, bind: 35 }, lull: { name: '졸음의 노래', kind: 'sleep', acc: 45, line: '나른한 노래가 귓가를 맴돈다...' },
  cold: { name: '차가운 손', pow: 11, acc: 90, weaken: 40 }, dirge: { name: '무덤의 노래', kind: 'sleep', acc: 40, line: '오래된 주문이 안개 속에 울린다...' },
  morgul: { name: '모르굴 칼', pow: 18, acc: 90 }, shriek: { name: '날카로운 비명', kind: 'debuff', stat: 'atk', line: '귀를 찢는 비명이 울려 퍼졌다!' },
  scratch: { name: '할퀴기', pow: 9, acc: 95 }, strangle: { name: '목 조르기', pow: 12, acc: 80 },
  tentacle: { name: '촉수 휘감기', pow: 12, acc: 85, bind: 40 }, splash: { name: '물보라', kind: 'debuff', stat: 'atk', line: '시커먼 물이 쏟아져 내렸다!' },
  rusty: { name: '녹슨 칼', pow: 10, acc: 90 }, swarm: { name: '떼로 덤비기', pow: 6, acc: 90, hits: 2 },
  club: { name: '몽둥이 내리치기', pow: 20, acc: 75 }, stomp: { name: '짓밟기', pow: 14, acc: 90 }, roarT: { name: '포효', kind: 'debuff', stat: 'def', line: '동굴이 쩌렁쩌렁 울린다!' },
  whip: { name: '불채찍', pow: 22, acc: 90, bind: 30 }, flame: { name: '불칼', pow: 28, acc: 80 }, wings: { name: '그림자 날개', kind: 'debuff', stat: 'atk', line: '어둠과 불길이 날개처럼 펼쳐졌다!' },
  cleave: { name: '언월도', pow: 18, acc: 85 }, bash: { name: '방패 밀치기', pow: 12, acc: 95 },
};
const FOES = {
  dog: { name: '송곳니', spr: 'dog', lv: 3, hp: 22, atk: 8, def: 6, spd: 10, type: '짐승', moves: ['bite', 'bite', 'growl'] },
  willow: { name: '버드나무 영감', spr: 'willow', lv: 6, hp: 70, atk: 7, def: 11, spd: 4, type: '나무', boss: true, moves: ['root', 'root', 'lull'] },
  wight: { name: '무덤 악령', spr: 'wight', lv: 7, hp: 44, atk: 10, def: 9, spd: 8, type: '망령', boss: true, moves: ['cold', 'cold', 'dirge'] },
  rider: { name: '검은 기사', spr: 'rider', lv: 15, hp: 95, atk: 19, def: 15, spd: 12, type: '어둠', boss: true, moves: ['morgul', 'morgul', 'shriek'] },
  gollum: { name: '골룸', spr: 'gollum', lv: 8, hp: 42, atk: 11, def: 8, spd: 14, type: '짐승', moves: ['scratch', 'strangle', 'scratch'] },
  watcher: { name: '호수의 감시자', spr: 'watcher', lv: 14, hp: 85, atk: 15, def: 12, spd: 8, type: '짐승', boss: true, moves: ['tentacle', 'tentacle', 'splash'] },
  goblin: { name: '모리아 고블린', spr: 'goblin', lv: 10, hp: 34, atk: 12, def: 8, spd: 13, type: '오크', moves: ['rusty', 'swarm', 'rusty'] },
  troll: { name: '동굴 트롤', spr: 'troll', lv: 16, hp: 115, atk: 20, def: 15, spd: 5, type: '짐승', boss: true, moves: ['club', 'stomp', 'roarT'] },
  balrog: { name: '발로그', spr: 'balrog', lv: 30, hp: 240, atk: 28, def: 22, spd: 12, type: '어둠', boss: true, moves: ['whip', 'flame', 'wings'] },
  riders5: { name: '검은 기사 다섯', spr: 'rider', lv: 12, hp: 120, atk: 16, def: 13, spd: 10, type: '어둠', boss: true, moves: ['morgul', 'shriek', 'morgul'] },
  warg: { name: '와르그', spr: 'warg', lv: 13, hp: 60, atk: 16, def: 10, spd: 14, type: '짐승', moves: ['bite', 'bite', 'growl'] },
  uruk: { name: '우루크하이', spr: 'uruk', lv: 18, hp: 95, atk: 20, def: 16, spd: 11, type: '오크', boss: true, moves: ['cleave', 'bash', 'cleave'] },
};
const EFFECT = { '불': { '나무': 2, '어둠': 2 }, '빛': { '망령': 2, '어둠': 2 } };   // 나즈굴은 불을 두려워한다

// ═════════ 저장 ═════════
const SAVE_KEY = 'ring-save-v1';
let S = null;   // 진행 상태
function newState(hero) {
  const h = HEROES[hero]; return { hero, lead: hero, party: [hero], mem: {}, lv: 5, xp: 0, hp: h.hp, items: { lembas: 3, herb: 2 }, shadow: 0, dagger: false, wound: false, step: 0, buff: { atk: 0, def: 0 } };
}
function statOf(id, lv, k) { const h = HEROES[id]; const base = { hp: h.hp, atk: h.atk, def: h.def, spd: h.spd }[k]; const grow = { hp: 4, atk: 2, def: 2, spd: 1 }[k];
  let v = base + grow * (lv - 5) + (k === 'atk' && id === 'frodosam' && S.dagger ? 3 : 0);
  if (k === 'hp' && id === 'frodosam' && S.wound) v = Math.round(v * 0.7);     // 모르굴 칼의 상처: 최대 체력 감소
  return v; }
function stat(k) { return statOf(S.hero, S.lv, k); }
// 동료: 지금 싸우는 인물은 S.hero/S.lv/S.xp/S.hp, 나머지는 S.mem 에 보관
function swapTo(id) { S.mem[S.hero] = { lv: S.lv, xp: S.xp, hp: S.hp }; const m = S.mem[id]; delete S.mem[id]; S.hero = id; S.lv = m.lv; S.xp = m.xp; S.hp = m.hp; }
function addMember(id, lv) { if (S.party.includes(id)) return; S.party.push(id); S.mem[id] = { lv, xp: 0, hp: statOf(id, lv, 'hp') }; }
function healAll() { S.hp = stat('hp'); for (const id in S.mem) S.mem[id].hp = statOf(id, S.mem[id].lv, 'hp'); }
function fix(s) { s.lead = s.lead || s.hero; s.party = s.party || [s.hero]; s.mem = s.mem || {}; return s; }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && HEROES[s.hero] ? fix(s) : null; } catch (e) { return null; } }

// ═════════ 전투 ═════════
let B = null;
function drawBar(x, y, cur, max) {

async function tween(obj, key, to, ms) { const from = obj[key], t0 = performance.now(); for (;;) { const k = Math.min(1, (performance.now() - t0) / ms); obj[key] = from + (to - from) * k; if (k >= 1) break; await wait(16); } }

}

async function switchIn(id, forced) {

async function heroTurn(act) {

  if (st.heroSleep > 0) { st.heroSleep--; await say(st.heroSleep ? josa(H.name, '은', '는') + ' 깊이 잠들어 있다...' : josa(H.name, '이', '가') + ' 퍼뜩 정신을 차렸다!'); if (st.heroSleep) return; }

    else { S.items.herb--; st.heroSleep = 0; st.heroBind = 0; S.buff.atk = Math.max(0, S.buff.atk); await say('약초를 씹었다. 몸이 가뿐해졌다.'); }

  if (mv.kind === 'hide') {
    S.shadow++; st.hide = true;
    await say('프로도가 반지를 끼자 모습이 사라졌다!', { keep: true });
    if (S.shadow >= 3) { const d = 3 + S.shadow; S.hp = Math.max(1, S.hp - d); await say(`반지가 무겁게 짓누른다... (그림자 ${S.shadow})`); }

  }
  msg = null;
  if (B.foe.hp <= 0) {
    await tween(B, 'foeFade', 0, 500); B.foeShow = false;
    await say(josa(B.foe.name, '을', '를') + ' 쓰러뜨렸다!');

async function foeTurn() {

    await chapterTitle('제2장', '브리와 바람마루');
    await story('브리 · 「달리는 조랑말」', 'frodosam_front', [
      '사람들로 북적이는 여관. 간달프는 오지 않았다. 여관 주인 버터버는 간달프가 맡긴 편지를 깜빡 잊고 있었다며 뒤늦게 내밀었다.',
      '피핀이 떠들다 「골목쟁이」라는 이름을 꺼냈다. 말리려고 일어서던 프로도가 넘어지며... 반지가 손가락에 끼워졌다!',
      '프로도의 모습이 사라졌다. 어딘가에서 불타는 눈이 이쪽을 보는 것 같다. (그림자 +1)',
    ]);
    S.shadow++;
    await story('브리 · 구석 자리', 'aragorn_front', [
      '반지를 빼자마자 누군가 프로도의 팔을 낚아챘다. 두건을 쓴 순찰자, 사람들은 그를 「성큼걸이」라 불렀다.',
      '성큼걸이: 조심성이 없군. 그 물건은 장난감이 아니오. 놈들이 이미 브리에 와 있소.',
    ]);
    const c = await choose('성큼걸이를...', ['믿는다', '의심한다']);
    if (c === 1) await say('샘이 의자를 들고 막아섰다. 성큼걸이가 조용히 부러진 칼자루를 보여 주었다. 간달프의 편지에 적힌 그 증표였다.');
    else await say('프로도는 그의 눈을 오래 바라보았다. 거칠어 보여도 나쁜 사람의 눈은 아니었다.');
    await story('브리 · 한밤중', 'rider', [
      '밤이 깊자 검은 기사들이 여관 방에 들이닥쳐 빈 침대를 마구 내리쳤다. 호빗들은 성큼걸이가 마련한 다른 방에 숨어 있었다.',
      '성큼걸이: 날이 밝으면 큰길을 버리고 들판을 가로지른다. 나를 따르시오.',
      '아라곤(성큼걸이)이 동료가 되었다! 전투 중 「동료」로 교대할 수 있다.',
    ]);
    addMember('aragorn', 7); S.step = 6; save();
  },
  async () => {
    await story('미지워터 늪', 'frodosam_front', [
      '모기가 구름처럼 들끓는 늪을 며칠이나 헤맸다. 샘은 투덜대며 쉴 새 없이 목덜미를 때렸다.',
      '피핀: 저 녀석들은 호빗이 없을 땐 뭘 먹고 사는 걸까요?',
      '모두 지치고 가려워 체력이 조금 줄었다.',
    ]);
    S.hp = Math.max(1, S.hp - 4); S.step = 7; save();
  },
  async () => {
    await story('바람마루', 'aragorn_front', [
      '옛 봉화대가 무너진 언덕 꼭대기. 아라곤이 정찰을 나간 사이 호빗들이 불을 피웠다.',
      '아래쪽 어둠 속에서 검은 형체 다섯이 천천히 올라온다!',
      '샘: 나리 뒤에 붙으세요! 횃불, 횃불을 들어요!',
    ]);
    if (S.hero !== 'frodosam' && S.party.includes('frodosam')) swapTo('frodosam');
    const r = await battle('riders5');
    await story('바람마루', 'rider', [
      '우두머리 기사가 칼을 높이 들었다. 겁에 질린 프로도의 손이 저도 모르게 반지를 향했다.',
      '반지를 낀 순간 세상이 잿빛으로 바뀌고, 왕관을 쓴 창백한 형상이 프로도의 어깨에 칼을 꽂았다!',
      r === 'win' ? '불길 속에서 기사들이 물러났다. 하지만 상처는 얼음처럼 차갑게 번져 간다.' : '아라곤이 양손에 횃불을 들고 뛰어들어 기사들을 쫓아냈다.',
      '프로도가 모르굴 칼에 다쳤다. 깊은골에 닿기 전까지 최대 체력이 줄어든다. (그림자 +1)',
    ]);
    S.shadow++; S.wound = true;
    if (r === 'lose') { S.hp = Math.max(S.hp, Math.round(stat('hp') / 3)); for (const id in S.mem) S.mem[id].hp = Math.max(S.mem[id].hp, Math.round(statOf(id, S.mem[id].lv, 'hp') / 3)); }
    if (S.hero === 'frodosam') S.hp = Math.min(S.hp, stat('hp')); else if (S.mem.frodosam) S.mem.frodosam.hp = Math.min(S.mem.frodosam.hp, statOf('frodosam', S.mem.frodosam.lv, 'hp'));
    S.step = 8; save();
  },
  async () => {
    await story('트롤숲', null, [
      '숲속 빈터에 거대한 트롤 셋이 돌이 된 채 서 있었다.',
      '샘: 이거 빌보 나리 이야기에 나오는 그 트롤들이잖아요! 정말 있었네!',
      '아라곤이 「아셀라스」 풀을 찾아와 프로도의 상처를 달랬다. 열이 조금 내렸다.',
    ]);
    if (S.hero === 'frodosam') S.hp = stat('hp'); else if (S.mem.frodosam) S.mem.frodosam.hp = statOf('frodosam', S.mem.frodosam.lv, 'hp');
    S.step = 9; save();
  },
  async () => {
    await story('브루이넨 여울', 'rider', [
      '빛나는 요정 아르웬이 말을 타고 나타나 프로도를 안장에 태웠다.',
      '검은 기사 아홉이 바짝 뒤쫓는다. 여울 건너편에 닿자 그녀가 몸을 돌렸다.',
    ]);
    const c = await choose('프로도는...', ['칼을 뽑아 든다', '반지를 움켜쥔다']);
    if (c === 1) { S.shadow++; await say('반지가 속삭인다... 하지만 끝내 끼지 않았다. (그림자 +1)'); }
    else await say('떨리는 손으로 작은 칼을 뽑았다. 「돌아가라! 반지는 너희 것이 아니다!」');
    await story('브루이넨 여울', null, [
      '강물이 굉음과 함께 솟구쳤다. 흰 말 떼 같은 물결이 기사들을 집어삼키고 휩쓸어 갔다.',
      '프로도는 정신을 잃었다...',
    ]);
    S.step = 10; save();
  },
  async () => {
    await story('깊은골', 'gandalf_front', [
      '눈을 떠 보니 부드러운 침대 위였다. 곁에 간달프가 앉아 있었다.',
      '간달프: 엘론드가 자네 어깨에서 칼끝 조각을 빼냈다네. 조금만 늦었어도 위험했어.',
      '상처가 나았다! 모두의 체력이 회복됐다.',
    ]);
    S.wound = false; healAll(); S.step = 11; save();
  },
  async () => {
    await chapterTitle('제2장 끝', '다음 이야기: 깊은골의 회의');
    await say('여기까지가 지금 만들어진 이야기입니다. 저장되었습니다.');
    S.step = 12; save();
  },
];
const PRACTICE_INTRO = {
  aragorn: ['브리의 「달리는 조랑말」 구석 자리. 두건을 깊이 쓴 순찰자가 문 쪽을 지켜보고 있다.', '그의 이야기는 아직 준비 중이다. 대신 연습 전투를 해 보자.'],
  legolas: ['어둠숲 요정 왕의 궁전. 붙잡아 두었던 골룸이 달아났다는 소식이 들어왔다.', '그의 이야기는 아직 준비 중이다. 대신 연습 전투를 해 보자.'],
  gimli: ['외로운 산. 모르도르에서 온 사자가 난쟁이 왕에게 반지를 캐물었다.', '그의 이야기는 아직 준비 중이다. 대신 연습 전투를 해 보자.'],
  gandalf: ['미나스 티리스의 서고. 먼지 쌓인 두루마리에서 반지의 비밀을 찾아냈다.', '그의 이야기는 아직 준비 중이다. 대신 연습 전투를 해 보자.'],
};
async function practice() {
  await story(null, S.hero + '_front', PRACTICE_INTRO[S.hero]);
  for (;;) {
    scene = storyScene('연습 전투', S.hero + '_front');
    const ids = Object.keys(FOES).sort((a, b) => FOES[a].lv - FOES[b].lv);
    const k = await choose('누구와 겨뤄 볼까?', ids.map(i => FOES[i].name + ' ' + FOES[i].lv).concat(['그만하기']));
    if (k === ids.length) return;
    const r = await battle(ids[k]);
    if (r === 'lose') { await lose(); }
    S.hp = stat('hp'); save();
  }
}

// ═════════ 제목·인물 선택 ═════════
async function title() {
  const has = load();
  let blink = 0;
  scene = t => {
    rect(0, 0, 160, 144, 0);
    const big = '반지 원정'; g.save(); g.scale(2, 2); g.drawImage(textImg(big, 3), 40 - tw(big) / 2, 8); g.restore();
    text('— 가운데땅 팬 게임 —', 80 - tw('— 가운데땅 팬 게임 —') / 2, 40, 2);
    const s = sprite('gandalf_front'); g.drawImage(s, 80 - s.width / 2, 116 - s.height);
    if (Math.floor(t / 500) % 2) text('START', 80 - tw('START') / 2, 126);
  };
  msg = null;
  for (;;) { const k = await nextKey(); if (k === 'start' || k === 'a') break; }
  if (has) { const c = await choose(null, ['이어하기', '새로 시작']); if (c === 0) { S = has; return; } }
  S = newState(await pickHero());
  save();
}
async function pickHero() {
  const ids = Object.keys(HEROES); let i = 0;
  scene = t => {
    rect(0, 0, 160, 144, 0);
    box(0, 0, 160, 20); const h = HEROES[ids[i]]; text('누구의 이야기를 따라갈까?', 80 - tw('누구의 이야기를 따라갈까?') / 2, 5);
    const s = sprite(ids[i] + '_front'); g.drawImage(s, 80 - s.width / 2, 92 - s.height);
    text('◀', 4, 56); text('▶', 148, 56);
    box(0, 96, 160, 48); text(h.full, 8, 102); text(h.desc[0], 8, 116, 2); text(h.desc[1], 8, 128, 2);
    for (let k = 0; k < ids.length; k++) rect(70 + k * 5, 90, 3, 3, k === i ? 3 : 1);
  };
  msg = null;
  for (;;) {
    const k = await nextKey();
    if (k === 'left') i = (i + ids.length - 1) % ids.length; else if (k === 'right') i = (i + 1) % ids.length;
    else if (k === 'a' || k === 'start') { const nm = HEROES[ids[i]].full, cc = nm.charCodeAt(nm.length - 1), ro = (cc - 0xac00) % 28 && (cc - 0xac00) % 28 !== 8 ? '으로' : '로';
      const c = await choose(nm + ro + ' 시작할까?', ['예', '아니오'], 1); if (c === 0) return ids[i]; }
  }
}

// ═════════ 시작 ═════════
(async function main() {
  await document.fonts.load('10px Galmuri9');
  for (;;) {
    await title();
    if (S.lead === 'frodosam') {
      while (S.step < CH1.length) { const before = S.step; await CH1[S.step](); if (S.step === before) { /* 패배: 같은 장면 다시 */ } }
      await say('START를 누르면 제목으로 돌아갑니다.'); await nextKey();
    } else await practice();
  }
})();
</script>
